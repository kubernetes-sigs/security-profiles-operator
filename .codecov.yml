---
codecov:
  notify:
    after_n_builds: 1
    require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: 50..75

  status:
    project:
      default:
        enabled: true
        # allowed to drop coverage and still result in a "success" commit status
        threshold: null
        if_not_found: success
        if_no_uploads: success
        if_ci_failed: error
    patch:
      default:
        enabled: true
        threshold: null
        if_not_found: success
        if_no_uploads: success
        if_ci_failed: error
    changes: false

comment:
  layout: "header, diff"
  behavior: default
  require_changes: false

# Generated code is not hand written and not worth covering. Counting it
# understates the coverage of the code that actually gets reviewed.
ignore:
  - "**/*fakes/**"
  - "**/zz_generated*.go"
  - "**/*.pb.go"
  - "internal/pkg/daemon/bpfrecorder/generated.go"
  - "internal/pkg/daemon/bpfrecorder/vmlinux/**"
