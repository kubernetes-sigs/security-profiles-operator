---
version: "2"
run:
  concurrency: 6
linters:
  default: none
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - funlen
    - forcetypeassert
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - ineffassign
    - intrange
    - iotamixing
    - kubeapilinter
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
    - zerologlint
    # - cyclop
    # - depguard
    # - embeddedstructfieldcheck
    # - err113
    # - exhaustruct_v5
    # - forbidigo
    # - funcorder
    # - gochecknoglobals
    # - gomoddirectives
    # - inamedparam
    # - interfacebloat
    # - ireturn
    # - mnd
    # - noctx
    # - noinlineerr
    # - nonamedreturns
    # - testpackage
    # - varnamelen
    # - wrapcheck
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kube API Linter lints Kube like APIs based on API conventions and best practices.
        settings:
          # nomaps and optionalfields are enabled by default. Optional fields
          # are value types with omitempty or omitzero where the zero value
          # is not a valid choice, so pointers are only required where
          # validation or serialization needs them.
          lintersConfig:
            optionalfields:
              pointers:
                preference: WhenRequired
    errcheck:
      check-type-assertions: true
      check-blank: true
    # Catches new oversized functions. The existing ones above the limits are
    # excluded by name below until they get split up.
    funlen:
      lines: 150
      statements: 80
      ignore-comments: true
    gocognit:
      min-complexity: 40
    goconst:
      min-occurrences: 6
      ignore-tests: true
    gocritic:
      enable-all: true
    godox:
      keywords:
        - BUG
        - FIXME
        - HACK
    gosec:
      excludes:
        - G115
        - G602
        # Unhandled errors, errcheck reports them already.
        - G104
    nestif:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    # No common-false-positives or legacy presets: they silence the gosec
    # file permission and file inclusion rules (G301, G302, G304, G307) and
    # the subprocess and unsafe rules (G103, G204) for the whole code base,
    # while the daemon writes host files from variable paths. The known true
    # positives are excluded one by one below.
    presets:
      - comments
      - std-error-handling
    rules:
      # The BPF map lookups hand pointers to libbpf.
      - linters:
          - gosec
        path: internal/pkg/(daemon/bpfrecorder/(bpfrecorder|impl)|daemon/enricher/auditsource/bpf|cli/recorder/impl)\.go
        text: G103
      # spoc record runs the command its user passes.
      - linters:
          - gosec
        path: internal/pkg/cli/command/impl\.go
        text: G204
      # Reads of paths which the daemon builds from the kubelet directory and
      # the profile names (seccomp, SELinux, AppArmor below /etc/apparmor.d
      # and the non-root enabler), the files the spoc commands get passed and
      # the directories the atomic file helpers write to.
      - linters:
          - gosec
        path: internal/pkg/(daemon/(apparmorprofile/apparmor_supported|seccompprofile/seccompprofile|selinuxprofile/common_controller)|nonrootenabler/nonrootenabler|artifact/impl|cli/[a-z]+/impl|util/files)\.go
        text: G304
      # Tests and the e2e suite run commands and write files of their own.
      - linters:
          - gosec
        path: (_test\.go|^test/)
        text: G(204|301|302|304|306|703)
      - linters:
          - modernize
        text: embedlit
      - linters:
          - lll
        path: internal/pkg/daemon/bpfrecorder/generated.go
      - linters:
          - godoclint
        path: api/
      - linters:
          - kubeapilinter
        path-except: api/
      # Table driven tests are long by nature.
      - linters:
          - funlen
          - maintidx
        path: (_test\.go|^test/)
      - linters:
          - funlen
        path: cmd/spoc/main\.go
        text: Function 'newApp'
      - linters:
          - funlen
        path: internal/pkg/daemon/profilerecorder/profilerecorder\.go
        text: Function 'Reconcile'
    paths:
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    golines:
      reformat-tags: false
  exclusions:
    generated: lax
    paths:
      - examples$
      - internal/pkg/daemon/bpfrecorder/generated.go
