---
version: "2"
run:
  concurrency: 6
linters:
  default: none
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - funlen
    - forcetypeassert
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - ineffassign
    - intrange
    - iotamixing
    - kubeapilinter
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
    - zerologlint
    # - cyclop
    # - depguard
    # - embeddedstructfieldcheck
    # - err113
    # - exhaustruct_v5
    # - forbidigo
    # - funcorder
    # - gochecknoglobals
    # - gomoddirectives
    # - inamedparam
    # - interfacebloat
    # - ireturn
    # - mnd
    # - noctx
    # - noinlineerr
    # - nonamedreturns
    # - testpackage
    # - varnamelen
    # - wrapcheck
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kube API Linter lints Kube like APIs based on API conventions and best practices.
        settings:
          linters:
            disable:
              - nomaps
              - optionalfields
    errcheck:
      check-type-assertions: true
      check-blank: true
    # Catches new oversized functions. The existing ones above the limits are
    # excluded by name below until they get split up.
    funlen:
      lines: 150
      statements: 80
      ignore-comments: true
    gocognit:
      min-complexity: 40
    goconst:
      min-occurrences: 6
      ignore-tests: true
    gocritic:
      enable-all: true
    godox:
      keywords:
        - BUG
        - FIXME
        - HACK
    gosec:
      excludes:
        - G115
        - G602
        - G702
        - G703
        - G704
    nestif:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - modernize
        text: embedlit
      - linters:
          - lll
        path: internal/pkg/daemon/bpfrecorder/generated.go
      - linters:
          - godoclint
        path: api/
      - linters:
          - kubeapilinter
        path-except: api/
      # Table driven tests are long by nature.
      - linters:
          - funlen
          - maintidx
        path: (_test\.go|^test/)
      - linters:
          - funlen
          - maintidx
        path: cmd/security-profiles-operator/main\.go
        text: "Function (name: main,|'main')"
      - linters:
          - funlen
        path: cmd/spoc/main\.go
        text: Function 'newApp'
      - linters:
          - funlen
        path: internal/pkg/daemon/enricher/jsonenricher\.go
        text: Function 'Run'
      - linters:
          - funlen
        path: internal/pkg/daemon/seccompprofile/seccompprofile\.go
        text: Function 'reconcileSeccompProfile'
      - linters:
          - funlen
          - maintidx
        path: internal/pkg/daemon/selinuxprofile/common_controller\.go
        text: "Function (name: reconcilePolicy,|'reconcilePolicy')"
      - linters:
          - funlen
        path: internal/pkg/daemon/profilerecorder/profilerecorder\.go
        text: Function 'Reconcile'
      - linters:
          - funlen
        path: internal/pkg/daemon/selinuxprofile/reload_job\.go
        text: Function 'createPolicyReloadJob'
      - linters:
          - funlen
        path: internal/pkg/manager/nodestatus/nodestatus\.go
        text: Function 'Reconcile'
      - linters:
          - funlen
        path: internal/pkg/manager/spod/spod_controller\.go
        text: Function '(Reconcile|getConfiguredSPOd)'
      - linters:
          - maintidx
        path: internal/pkg/manager/spod/spod_controller\.go
        text: "Function name: getConfiguredSPOd,"
      - linters:
          - funlen
        path: internal/pkg/manager/workloadannotator/workloadannotator\.go
        text: Function 'Reconcile'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    golines:
      reformat-tags: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/pkg/daemon/bpfrecorder/generated.go
