---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-profiles-operator-webhook
  namespace: security-profiles-operator
spec:
  replicas: 3
  selector:
    matchLabels:
      name: security-profiles-operator-webhook
      app: security-profiles-operator
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        name: security-profiles-operator-webhook
        app: security-profiles-operator
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: spo-webhook
      # Pod creations in the namespaces which enable binding or recording
      # depend on the fail closed webhooks.
      priorityClassName: system-cluster-critical
      containers:
        - name: security-profiles-operator
          image: security-profiles-operator
          args:
          - webhook
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: health
              containerPort: 8085
              protocol: TCP
          # The replica only gets admission requests once its webhook server
          # runs and its caches are synced. Keep in sync with the managed
          # webhook in internal/pkg/manager/spod/bindata/webhook.go.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8085
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              memory: 32Mi
              cpu: 250m
            limits:
              memory: 64Mi
              cpu: 500m
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      # Spread the replicas, so that a single node going down does not take
      # the webhook down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: security-profiles-operator
                    name: security-profiles-operator-webhook
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: cert
          secret:
            secretName: webhook-server-cert
            defaultMode: 420
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
