---
# The webhook configurations are static in this overlay, so the operator does
# not manage them. It still reads them, the SPOD controller watches them and
# the admission policies follow the deployed recording webhook. The test
# operations make the build fail instead of changing the wrong rule if the
# generated rules change.
- op: test
  path: /rules/6/resourceNames
  value: ["spo-validating-webhook-configuration"]
- op: replace
  path: /rules/6/verbs
  value: ["get", "list", "watch"]
- op: test
  path: /rules/3/resources
  value:
    - mutatingwebhookconfigurations
    - validatingadmissionpolicies
    - validatingadmissionpolicybindings
    - validatingwebhookconfigurations
- op: replace
  path: /rules/3/resources
  value:
    - validatingadmissionpolicies
    - validatingadmissionpolicybindings
- op: test
  path: /rules/2/resourceNames
  value: ["spo-mutating-webhook-configuration"]
- op: replace
  path: /rules/2/verbs
  value: ["get", "list", "watch"]
