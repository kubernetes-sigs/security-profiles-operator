---
# The OpenShift cluster monitoring discovers the metrics endpoints of the
# ServiceMonitor in the operator namespace, so its prometheus-k8s service
# account only needs to read the pods, services and endpoints there. The
# spo-metrics-client ClusterRole keeps granting the metrics paths only. The
# OLM bundle and the OpenShift overlays build on this overlay, and OpenShift
# users apply it directly. On other clusters the binding only grants
# something to whoever creates the openshift-monitoring/prometheus-k8s
# service account, see doc/security-model.md. Like every namespaced object
# of this overlay, the Role and its binding name the
# security-profiles-operator namespace, which OLM and the downstream
# packaging replace with their own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spo-prometheus-k8s
  namespace: security-profiles-operator
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spo-prometheus-k8s
  namespace: security-profiles-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spo-prometheus-k8s
subjects:
- kind: ServiceAccount
  name: prometheus-k8s
  namespace: openshift-monitoring
