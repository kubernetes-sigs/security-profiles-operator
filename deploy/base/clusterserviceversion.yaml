---
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Security
    containerImage: us-central1-docker.pkg.dev/k8s-staging-images/sp-operator/security-profiles-operator:latest
    olm.skipRange: '>=1.0.0 <1.1.1-dev'
    operatorframework.io/suggested-namespace: security-profiles-operator
    operators.openshift.io/valid-subscription: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
    operatorframework.io/cluster-monitoring: "true"
    operatorframework.io/os.linux: supported
  name: security-profiles-operator.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: AppArmorProfile is a cluster level specification for an AppArmor
        profile.
      displayName: App Armor Profile
      kind: AppArmorProfile
      name: apparmorprofiles.security-profiles-operator.x-k8s.io
      version: v1
    - description: ProfileBinding is the Schema for the profilebindings API.
      displayName: Profile Binding
      kind: ProfileBinding
      name: profilebindings.security-profiles-operator.x-k8s.io
      version: v1
    - description: ProfileRecording is the Schema for the profilerecordings API.
      displayName: Profile Recording
      kind: ProfileRecording
      name: profilerecordings.security-profiles-operator.x-k8s.io
      version: v1
    - description: SeccompProfile is a cluster level specification for a seccomp profile.
        See https://github.com/opencontainers/runtime-spec/blob/master/config-linux.md#seccomp
      displayName: Seccomp Profile
      kind: SeccompProfile
      name: seccompprofiles.security-profiles-operator.x-k8s.io
      version: v1
    - description: SecurityProfileNodeStatus is a per-node status of a security profile
      displayName: Security Profile Node Status
      kind: SecurityProfileNodeStatus
      name: securityprofilenodestatuses.security-profiles-operator.x-k8s.io
      version: v1
    - description: SecurityProfilesOperatorDaemon is the Schema to configure the spod
        deployment.
      displayName: Security Profiles Operator Daemon
      kind: SecurityProfilesOperatorDaemon
      name: securityprofilesoperatordaemons.security-profiles-operator.x-k8s.io
      version: v1
      resources:
      - kind: DaemonSet
        name: spod
        version: v1
      - kind: Deployment
        name: security-profiles-operator-webhook
        version: v1
      - kind: PodDisruptionBudget
        name: security-profiles-operator-webhook
        version: v1
      - kind: Service
        name: metrics
        version: v1
      - kind: Service
        name: webhook-service
        version: v1
      specDescriptors:
      - description: Enables the AppArmor support of the daemon.
        displayName: Enable AppArmor
        path: enableAppArmor
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: Enables the SELinux support of the daemon.
        displayName: Enable SELinux
        path: selinux.enable
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: Enables the log enricher, which enriches the audit logs with
          the container metadata.
        displayName: Enable Log Enricher
        path: enricher.enableLogEnricher
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: Enables the JSON enricher, which writes the audit logs as
          JSON lines.
        displayName: Enable JSON Enricher
        path: enricher.enableJsonEnricher
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: Enables the BPF recorder for recording seccomp and AppArmor
          profiles.
        displayName: Enable BPF Recorder
        path: enricher.enableBpfRecorder
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: The logging verbosity of the daemon.
        displayName: Verbosity
        path: verbosity
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      statusDescriptors:
      - description: The state of the daemon.
        displayName: State
        path: state
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.phase
      - description: The conditions of the daemon.
        displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
    - description: RawSelinuxProfile is the Schema for the raw selinuxprofiles API.
      displayName: Raw Selinux Profile
      kind: RawSelinuxProfile
      name: rawselinuxprofiles.security-profiles-operator.x-k8s.io
      version: v1
    - description: SelinuxProfile is the Schema for the selinuxprofiles API.
      displayName: Selinux Profile
      kind: SelinuxProfile
      name: selinuxprofiles.security-profiles-operator.x-k8s.io
      version: v1
  description: SPO is an operator which aims to make it easier for users to use SELinux, seccomp and AppArmor in Kubernetes clusters
  displayName: Security Profiles Operator
  icon:
  - base64data: ""
    mediatype: "image/svg+xml"
  install:
    spec:
      deployments: null
    strategy: ""
  installModes:
  - supported: true
    type: OwnNamespace
  - supported: true
    type: SingleNamespace
  - supported: true
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - security
  - selinux
  - seccomp
  - apparmor
  - ebpf
  links:
  - name: Security Profiles Operator
    url: https://github.com/kubernetes-sigs/security-profiles-operator
  maintainers:
  - email: dev@kubernetes.io
    name: Kubernetes upstream
  maturity: stable
  minKubeVersion: 1.30.0
  provider:
    name: Kubernetes SIGs
    url: https://github.com/kubernetes-sigs
  replaces: security-profiles-operator.v1.1.0
  version: 0.0.0
