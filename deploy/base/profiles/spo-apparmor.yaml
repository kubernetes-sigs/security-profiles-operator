apiVersion: security-profiles-operator.x-k8s.io/v1
kind: AppArmorProfile
metadata:
  labels:
    spo.x-k8s.io/container-id: security-profiles-operator
  name: spo-apparmor
spec:
  abstract:
    capability:
      allowedCapabilities:
      - dac_override
      - dac_read_search
      - mac_admin
      - sys_admin
      - sys_chroot
      - sys_ptrace
    executable:
      allowedExecutables:
      - /security-profiles-operator
      - /usr/sbin/apparmor_parser
      - /sbin/apparmor_parser
    filesystem:
      readOnlyPaths:
      - /  # workaround for apparmor bug
      - /etc/apparmor/parser.conf
      # name resolution and CA certificates for pulling base profiles
      - /etc/hosts
      - /etc/nsswitch.conf
      - /etc/resolv.conf
      - /etc/pki/**
      - /etc/ssl/certs/
      - /etc/ssl/certs/**
      - /proc/@{pid}/maps
      - /proc/@{pid}/mounts
      - /proc/sys/kernel/osrelease
      - /proc/sys/net/core/somaxconn
      - /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
      - /var/run/secrets/kubernetes.io/serviceaccount/**
      - /var/run/secrets/metrics/**
      - /sys/module/apparmor/parameters/enabled
      - /sys/devices/system/cpu/possible
      - /etc/apparmor.d/
      - /var/lib/kubelet/seccomp/operator/
      readWritePaths:
      - /var/run/grpc/metrics.sock
      # the profile recorder connects to the bpf recorder and the enricher
      - /var/run/grpc/bpf-recorder.sock
      - /var/run/grpc/enricher.sock
      # The pulled artifacts and the sigstore TUF cache in $HOME live in
      # emptyDir volumes. The compiled AppArmor profiles go to the /tmp of
      # the host, because apparmor_parser runs in its mount namespace. While
      # the daemon is in that namespace, all paths also match on the host,
      # so only the files of the daemon are allowed.
      - /tmp/aa_profile_bin_*
      - /tmp/pull-*/
      - /tmp/pull-*/**
      - /home/.sigstore/
      - /home/.sigstore/**
      - /etc/apparmor.d/**
      - /sys/kernel/security/apparmor/
      - /sys/kernel/security/apparmor/**
      - /var/lib/kubelet/seccomp/operator/**
    network:
      allowedProtocols:
        allowTcp: true
        allowUdp: true
    ptrace:
      allowedAccess:
      - read
  state: Enabled
