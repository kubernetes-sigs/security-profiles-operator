---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-profiles-operator
  namespace: security-profiles-operator
spec:
  replicas: 3
  selector:
    matchLabels:
      name: security-profiles-operator
  template:
    metadata:
      annotations:
        # The operator needs no privileges, so pin the most restricted SCC
        # on OpenShift.
        openshift.io/required-scc: restricted-v2
      labels:
        name: security-profiles-operator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: security-profiles-operator
      # The operator manages the daemon and the webhooks, which every node and
      # pod admission in the opted in namespaces depend on.
      priorityClassName: system-cluster-critical
      containers:
        - name: security-profiles-operator
          image: security-profiles-operator
          args:
          - manager
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8085
              protocol: TCP
          # Startup is gated separately, so that a slow start does not make the
          # liveness probe restart a manager which is still coming up. The budget
          # is generous because the health server only binds inside
          # `Manager.Start`, after up to two ten second API calls which detect
          # OpenShift and fetch its TLS profile.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 3
            periodSeconds: 10
          # The manager serves the health endpoints before it waits for its
          # informer caches, so only readiness can tell a working operator from
          # one which never started a single controller.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 3
            periodSeconds: 10
            # Above the timeout the check itself uses, so that it reports an
            # unsynced cache rather than being cut off before it can.
            timeoutSeconds: 6
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          # The manager caches the profiles, their node statuses and the pods
          # of the whole cluster, which grows with the cluster. The request
          # fits small clusters, while the limit leaves room for large ones.
          resources:
            requests:
              memory: 50Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          env:
            # The selinuxd images run privileged on every node, so they are
            # pinned by digest like the operator image. hack/update-selinuxd.sh
            # bumps them, dependencies.yaml tracks the digests.
            - name: RELATED_IMAGE_SELINUXD
              value: quay.io/security-profiles-operator/selinuxd@sha256:f47bd24fb928bd0d168b86147e3536cf555c94fc5b85de3247fd16dad33f9460
            - name: RELATED_IMAGE_SELINUXD_EL8
              value: quay.io/security-profiles-operator/selinuxd-el8@sha256:e6e7febc76f5f032d42d35b98cc651354dd14ac5ae7b2a7d7403222788e41e4d
            - name: RELATED_IMAGE_SELINUXD_EL9
              value: quay.io/security-profiles-operator/selinuxd-el9@sha256:cddbd306c48ee8d19b8fb07b2acda1ee99cb3f1d9c3988f828d24b4f2de5ad3c
            - name: RELATED_IMAGE_SELINUXD_FEDORA
              value: quay.io/security-profiles-operator/selinuxd-fedora@sha256:a5c36469e66bc44c32fc36d8d23571ed8903430233d32136b6272013a535627d
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.annotations['olm.targetNamespaces']
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBELET_DIR
              value: "/var/lib/kubelet"
      # Spread the replicas across nodes and zones where possible, so that
      # a single failure does not take down every replica.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              name: security-profiles-operator
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              name: security-profiles-operator
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
