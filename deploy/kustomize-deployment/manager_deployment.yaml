---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-profiles-operator
  namespace: security-profiles-operator
spec:
  replicas: 3
  selector:
    matchLabels:
      name: security-profiles-operator
  template:
    metadata:
      labels:
        name: security-profiles-operator
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: security-profiles-operator
      containers:
        - name: security-profiles-operator
          image: security-profiles-operator
          args:
          - manager
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8085
              protocol: TCP
          # Startup is gated separately, so that a slow start does not make the
          # liveness probe restart a manager which is still coming up. The budget
          # is generous because the health server only binds inside
          # `Manager.Start`, after up to two ten second API calls which detect
          # OpenShift and fetch its TLS profile.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 3
            periodSeconds: 10
          # The manager serves the health endpoints before it waits for its
          # informer caches, so only readiness can tell a working operator from
          # one which never started a single controller.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 3
            periodSeconds: 10
            # Above the timeout the check itself uses, so that it reports an
            # unsynced cache rather than being cut off before it can.
            timeoutSeconds: 6
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 50Mi
              cpu: 250m
            limits:
              memory: 128Mi
              cpu: 500m
          env:
            - name: RELATED_IMAGE_SELINUXD
              value: quay.io/security-profiles-operator/selinuxd
            - name: RELATED_IMAGE_SELINUXD_EL8
              value: quay.io/security-profiles-operator/selinuxd-el8:latest
            - name: RELATED_IMAGE_SELINUXD_EL9
              value: quay.io/security-profiles-operator/selinuxd-el9:latest
            - name: RELATED_IMAGE_SELINUXD_FEDORA
              value: quay.io/security-profiles-operator/selinuxd-fedora:latest
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.annotations['olm.targetNamespaces']
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBELET_DIR
              value: "/var/lib/kubelet"
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
