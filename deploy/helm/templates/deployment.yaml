apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "security-profiles-operator.labels" . | nindent 4 }}
  name: security-profiles-operator
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "security-profiles-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "security-profiles-operator.annotations" . | nindent 8 }}
      labels:
        {{- include "security-profiles-operator.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - args:
        - manager
        env:
        - name: RELATED_IMAGE_SELINUXD
          value: {{ .Values.selinuxdImage.default.registry }}/{{ .Values.selinuxdImage.default.repository }}:{{ .Values.selinuxdImage.default.tag }}
        - name: RELATED_IMAGE_SELINUXD_EL8
          value: {{ .Values.selinuxdImage.el8.registry }}/{{ .Values.selinuxdImage.el8.repository }}:{{ .Values.selinuxdImage.el8.tag }}
        - name: RELATED_IMAGE_SELINUXD_EL9
          value: {{ .Values.selinuxdImage.el9.registry }}/{{ .Values.selinuxdImage.el9.repository }}:{{ .Values.selinuxdImage.el9.tag }}
        - name: RELATED_IMAGE_SELINUXD_FEDORA
          value: {{ .Values.selinuxdImage.fedora.registry }}/{{ .Values.selinuxdImage.fedora.repository }}:{{ .Values.selinuxdImage.fedora.tag }}
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.restrictToNamespace }}
        - name: RESTRICT_TO_NAMESPACE
          value: {{ .Values.restrictToNamespace | quote }}
        {{- end }}
        image: {{ .Values.spoImage.registry }}/{{ .Values.spoImage.repository }}:{{ .Values.spoImage.tag }}
        imagePullPolicy: {{ .Values.spoImage.pullPolicy | default "Always" }}
        name: {{ .Chart.Name }}
        ports:
        - name: health
          containerPort: 8085
          protocol: TCP
        # Startup is gated separately, so that a slow start does not make the
        # liveness probe restart a manager which is still coming up. The budget
        # is generous because the health server only binds inside
        # `Manager.Start`, after up to two ten second API calls which detect
        # OpenShift and fetch its TLS profile.
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          failureThreshold: 30
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          failureThreshold: 3
          periodSeconds: 10
        # The manager serves the health endpoints before it waits for its
        # informer caches, so only readiness can tell a working operator from
        # one which never started a single controller.
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          failureThreshold: 3
          periodSeconds: 10
          # Above the timeout the check itself uses, so that it reports an
          # unsynced cache rather than being cut off before it can.
          timeoutSeconds: 6
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      {{- with .Values.podSecurityContext }}
      securityContext:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "security-profiles-operator.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
      {{- with .Values.tolerations }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
