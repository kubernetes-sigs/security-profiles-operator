      dyn(s.?abstract.?executable.hasValue() ? [ dyn(s.abstract.executable.?allowedExecutables.orValue([])),
      dyn(s.abstract.executable.?allowedLibraries.orValue([]))] : []), dyn(s.?abstract.?filesystem.hasValue()
      ? [ dyn(s.abstract.filesystem.?readOnlyPaths.orValue([])), dyn(s.abstract.filesystem.?writeOnlyPaths.orValue([])),
      dyn(s.abstract.filesystem.?readWritePaths.orValue([]))] : []), dyn(s.?abstract.?network.hasValue()
      ? [ dyn(has(s.abstract.network.allowRaw) ? [s.abstract.network.allowRaw] : []),
      dyn(has(s.abstract.network.allowedProtocols) ? [ dyn(has(s.abstract.network.allowedProtocols.allowTcp)
      ? [s.abstract.network.allowedProtocols.allowTcp] : []), dyn(has(s.abstract.network.allowedProtocols.allowUdp)
      ? [s.abstract.network.allowedProtocols.allowUdp] : [])] : [])] : []), dyn(s.?abstract.?capability.hasValue()
      ? [ dyn(s.abstract.capability.?allowedCapabilities.orValue([]))] : []), dyn(s.?abstract.?ptrace.hasValue()
      ? [ dyn(s.abstract.ptrace.?allowedAccess.orValue([])), dyn(s.abstract.ptrace.?peer.orValue(''''))]
      : [])] : request.kind.kind == ''SelinuxProfile'' ? [ dyn(s.?state.orValue('''')),
      dyn(s.?mode.orValue('''')), dyn(s.?inherit.orValue([]).size() > 0 ? s.inherit.map(i,
      [ dyn(i.?kind.orValue('''')), dyn(i.?name.orValue(''''))]) : [[dyn(''System''),
      dyn(''container'')]]), dyn(s.?allow.orValue({}))] : [ dyn(s.?state.orValue('''')),
      dyn(s.?policy.orValue(''''))])'
    name: specs
