  - expression: 'has(object.metadata.labels) ? object.metadata.labels : {}'
    name: labels
  - expression: 'request.operation == ''UPDATE'' && has(oldObject.metadata.labels)
      ? oldObject.metadata.labels : {}'
    name: oldLabels
  - expression: request.kind.kind != 'RawSelinuxProfile' && 'spo.x-k8s.io/recording-id'
      in variables.oldLabels
    name: recorded
  - expression: '[object, oldObject].map(o, o.?spec.orValue({})).map(s, request.kind.kind
