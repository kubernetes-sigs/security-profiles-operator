apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  annotations:
    meta.helm.sh/release-name: '{{ .Release.Name }}'
    meta.helm.sh/release-namespace: '{{ .Release.Namespace }}'
  labels:
    app: security-profiles-operator
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: security-profiles-operator
  name: spo-spod-jobs
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == 'system:serviceaccount:' + request.namespace
      + ':spod'
    name: spod-service-account
  matchConstraints:
    resourceRules:
    - apiGroups:
      - batch
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
  validations:
  - expression: has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName
      == 'spod'
    message: Jobs of the spod service account have to run as the spod service account
    reason: Forbidden
  - expression: size(variables.requestNodes) > 0
    message: The service account token of the spod service account has to name the
      node of the requesting pod
    reason: Forbidden
  - expression: has(variables.podSpec.nodeName) && variables.podSpec.nodeName != ''
      && variables.podSpec.nodeName in variables.requestNodes
    message: Jobs of the spod service account have to run on the node of the requesting
      pod
    reason: Forbidden
  - expression: '!(has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork)
      && !(has(variables.podSpec.hostPID) && variables.podSpec.hostPID) && !(has(variables.podSpec.hostIPC)
      && variables.podSpec.hostIPC)'
    message: Jobs of the spod service account must not use host namespaces
    reason: Forbidden
  - expression: size(variables.podSpec.containers) == 1 && (!has(variables.podSpec.initContainers)
      || size(variables.podSpec.initContainers) == 0) && variables.podSpec.containers.all(c,
      !has(c.envFrom) && (!has(c.env) || c.env.all(e, !has(e.valueFrom))))
    message: Jobs of the spod service account have to run a single container without
      environment from secrets or config maps
    reason: Forbidden
  - expression: '!has(variables.podSpec.volumes) || variables.podSpec.volumes.all(v,
      has(v.hostPath) && v.hostPath.path in [''/sys/fs/selinux'', ''/etc/selinux'',
      ''/var/lib/selinux''] && has(v.hostPath.type) && v.hostPath.type == ''Directory'')'
    message: Jobs of the spod service account may only mount the SELinux host paths
      as directories
    reason: Forbidden
  variables:
  - expression: object.spec.template.spec
    name: podSpec
  - expression: 'has(request.userInfo.extra) && ''authentication.kubernetes.io/node-name''
      in request.userInfo.extra ? request.userInfo.extra[''authentication.kubernetes.io/node-name'']
      : []'
    name: requestNodes
---
