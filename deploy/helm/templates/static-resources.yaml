      == variables.oldLabels[?'spo.x-k8s.io/recording-id']
    message: The spod service account must not change the spo.x-k8s.io/recording-id
      label
    reason: Forbidden
  - expression: request.operation != 'UPDATE' || variables.recorded || (variables.oldLabels.all(k,
      k == 'spo.x-k8s.io/profile-id' || variables.labels[?k] == optional.of(variables.oldLabels[k]))
      && variables.labels.all(k, k == 'spo.x-k8s.io/profile-id' || k in variables.oldLabels))
