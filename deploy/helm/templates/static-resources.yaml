      dyn(s.?listenerMetadata.orValue('''')), dyn(s.?flags.orValue([])), dyn(s.?syscalls.orValue([]).map(c,
      [ dyn(c.?names.orValue([])), dyn(c.?action.orValue('''')), dyn(c.?errnoRet.orValue(0)),
      dyn(c.?args.orValue([]).map(a, [ dyn(has(a.index) ? [a.index] : []), dyn(a.?value.orValue(0)),
      dyn(a.?valueTwo.orValue(0)), dyn(a.?op.orValue(''''))]))]))] : request.kind.kind
