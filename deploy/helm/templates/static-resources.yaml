  name: spo-spod-jobs
spec:
  policyName: spo-spod-jobs
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  annotations:
    meta.helm.sh/release-name: '{{ .Release.Name }}'
    meta.helm.sh/release-namespace: '{{ .Release.Namespace }}'
  labels:
    app: security-profiles-operator
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: security-profiles-operator
  name: spo-spod-node-statuses
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:spod$')
    name: spod-service-account
  matchConstraints:
    resourceRules:
    - apiGroups:
      - security-profiles-operator.x-k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - securityprofilenodestatuses
      - securityprofilenodestatuses/status
  validations:
  - expression: size(variables.requestNodes) == 0 || (request.operation != 'CREATE'
      || object.spec.nodeName in variables.requestNodes) && variables.ownStatuses.all(own,
      own)
    message: The spod service account may only write the node statuses of the node
      of the requesting pod
    reason: Forbidden
  - expression: '!(request.operation == ''CREATE'' || request.operation == ''UPDATE''
      && !variables.oldLabel.hasValue() && variables.label.hasValue()) || (object.?spec.?nodeName.orValue('''')
      != '''' ? size(object.spec.nodeName) > 63 || variables.label == optional.of(object.spec.nodeName)
      : size(variables.requestNodes) == 0 || variables.label.orValue('''') in variables.requestNodes)'
    message: The spo.x-k8s.io/node-name label of a node status has to name its node
    reason: Forbidden
  - expression: request.operation != 'UPDATE' || !variables.oldLabel.hasValue() ||
      variables.label == variables.oldLabel
    message: The spod service account must not change or remove the spo.x-k8s.io/node-name
      label of a node status
    reason: Forbidden
