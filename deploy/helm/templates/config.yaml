{{- /*
spod.spec overrides the fields rendered from the dedicated values. Objects get
merged field by field, every other value, lists included, replaces the
rendered one.
*/}}
{{- $spec := include "security-profiles-operator.spodSpec" . | fromYaml }}
{{- $spec = mergeOverwrite $spec (deepCopy ((.Values.spod | default dict).spec | default dict)) }}
apiVersion: security-profiles-operator.x-k8s.io/v1
kind: SecurityProfilesOperatorDaemon
metadata:
  labels:
    {{- include "security-profiles-operator.labels" . | nindent 4 }}
  name: spod
  namespace: {{ .Release.Namespace }}
spec:
  {{- toYaml $spec | nindent 2 }}
