# Default values for security-profiles-operator.
replicaCount: 3

spoImage:
  registry: us-central1-docker.pkg.dev
  repository: k8s-staging-images/sp-operator/security-profiles-operator
  tag: latest
  pullPolicy: Always

selinuxdImage:
  default:
    registry: quay.io
    repository: security-profiles-operator/selinuxd
    tag: latest
  el8:
    registry: quay.io
    repository: security-profiles-operator/selinuxd-el8
    tag: latest
  el9:
    registry: quay.io
    repository: security-profiles-operator/selinuxd-el9
    tag: latest
  fedora:
    registry: quay.io
    repository: security-profiles-operator/selinuxd-fedora
    tag: latest

# Deprecated, use selinux.enable instead
enableSelinux: false
selinux:
  # enable: false # Overrides deprecated enableSelinux flag
  enableRawSelinuxProfiles: true
  typeTag: spc_t
  customTemplatesConfigMap: ""
  options: {}
    # allowedSystemProfiles:
    #   - container
    # deniedTypes: []
    # deniedClasses: []
    # deniedPermissions: []
    # allowedTypes: []
    # allowedClasses: []
    # allowedPermissions: []
enableLogEnricher: false
enableJsonEnricher: false
enableAppArmor: false
enableBpfRecorder: false
enableProfiling: false
verbosity: 0
restrictToNamespace: ""

webhook:
  tolerations: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # If name is not set, use the generated fullname when create is true and
  # "default" otherwise
  create: true
  # The name of the service account to use.
  name: ""

podSecurityContext: {}
  # fsGroup: 2000

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 250m
    memory: 50Mi

daemon:
  affinity: {}
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
  resources:
    limits:
      memory: 128Mi
      ephemeral-storage: 200Mi
    requests:
      cpu: 100m
      memory: 64Mi
      ephemeral-storage: 50Mi

# Do not set the replica count of the operator deployment, for example when
# it is scaled externally
autoscaling:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}
