# Default values for security-profiles-operator.
replicaCount: 3

spoImage:
  registry: us-central1-docker.pkg.dev
  repository: k8s-staging-images/sp-operator/security-profiles-operator
  tag: latest
  pullPolicy: Always

# The selinuxd images run privileged on every node, so they are pinned by
# digest. The tag is only used when the digest is set to an empty string.
# hack/update-selinuxd.sh bumps the digests.
selinuxdImage:
  default:
    registry: quay.io
    repository: security-profiles-operator/selinuxd
    tag: latest
    digest: sha256:f47bd24fb928bd0d168b86147e3536cf555c94fc5b85de3247fd16dad33f9460  # quay.io/security-profiles-operator/selinuxd:latest
  el8:
    registry: quay.io
    repository: security-profiles-operator/selinuxd-el8
    tag: latest
    digest: sha256:e6e7febc76f5f032d42d35b98cc651354dd14ac5ae7b2a7d7403222788e41e4d  # quay.io/security-profiles-operator/selinuxd-el8:latest
  el9:
    registry: quay.io
    repository: security-profiles-operator/selinuxd-el9
    tag: latest
    digest: sha256:cddbd306c48ee8d19b8fb07b2acda1ee99cb3f1d9c3988f828d24b4f2de5ad3c  # quay.io/security-profiles-operator/selinuxd-el9:latest
  fedora:
    registry: quay.io
    repository: security-profiles-operator/selinuxd-fedora
    tag: latest
    digest: sha256:a5c36469e66bc44c32fc36d8d23571ed8903430233d32136b6272013a535627d  # quay.io/security-profiles-operator/selinuxd-fedora:latest

# The kubelet root directory of the nodes, where the seccomp profiles get
# installed.
kubeletDir: /var/lib/kubelet

# Deprecated, use selinux.enable instead
enableSelinux: false
selinux:
  # enable: false # Overrides deprecated enableSelinux flag
  enableRawSelinuxProfiles: true
  typeTag: spc_t
  customTemplatesConfigMap: ""
  options: {}
    # allowedSystemProfiles:
    #   - container
    # deniedTypes: []
    # deniedClasses: []
    # deniedPermissions: []
    # allowedTypes: []
    # allowedClasses: []
    # allowedPermissions: []
enableLogEnricher: false
enableJsonEnricher: false
enableAppArmor: false
enableBpfRecorder: false
enableProfiling: false
verbosity: 0
restrictToNamespace: ""

webhook:
  tolerations: []

nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 250m
    memory: 50Mi

daemon:
  affinity: {}
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
  resources:
    limits:
      memory: 128Mi
      ephemeral-storage: 200Mi
    requests:
      cpu: 100m
      memory: 64Mi
      ephemeral-storage: 50Mi

# Do not set the replica count of the operator deployment, for example when
# it is scaled externally
autoscaling:
  enabled: false

# Keeps at least minAvailable operator replicas running during voluntary
# disruptions like node drains, so that the operands keep getting reconciled.
# With a single replica, minAvailable 1 blocks the drain of its node.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Spreads the operator replicas across nodes and zones where possible, so that
# a single failure does not take down every replica. Constraints without a
# labelSelector get the selector labels of the operator pods.
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}

tolerations: []

affinity: {}
