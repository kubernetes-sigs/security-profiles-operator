# Configuration of markdownlint-cli2, see the docs job of the lint workflow.
config:
  default: true
  # Long lines in prose, tables and commands are fine.
  MD013: false  # line-length
  # Aligning table columns by hand is not worth the churn.
  MD060: false  # table-column-style
  # Go code blocks indent with tabs.
  MD010:
    code_blocks: false
  # mdtoc renders the headings with code spans as <code>.
  MD033:
    allowed_elements: [code]

globs:
  - "**/*.md"

ignores:
  - ".direnv/**"
  - "vendor/**"
  - "node_modules/**"
  - "build/**"
  - ".claude/**"
  # Generated by make update-docs from the command definitions.
  - "doc/reference/**"
