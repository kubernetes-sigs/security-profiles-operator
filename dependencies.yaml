  - name: libbpf
    version: 1.7.0
    upstream:
      flavour: github
      url: libbpf/libbpf
    refPaths:
    - path: hack/install-libbpf.sh
      match: "^VERSION="

  # Must be bumped together with libbpf above, the checksum of the source
  # archive of the tag.
  - name: libbpf-sha256
    version: 7ab5feffbf78557f626f2e3e3204788528394494715a30fc2070fcddc2051b7b
    refPaths:
    - path: hack/install-libbpf.sh
      match: "^SHA256="

  # The libbpf release libbpfgo is built against. Must be bumped together with
  # libbpf above, which hack/install-libbpf.sh installs for the build.
  - name: libbpfgo-libbpf
    version: 1.8-dev
    refPaths:
    - path: go.mod
      match: "github.com/aquasecurity/libbpfgo v"

  # The Debian package hack/update-vmlinux generates the vmlinux headers of
  # the BPF recorder from. Rerun it after a bump.
  - name: linux-bpf-dev
    version: 6.12.41-1
    refPaths:
    - path: hack/update-vmlinux
      match: "^PACKAGE_VERSION="
    - path: internal/pkg/daemon/bpfrecorder/vmlinux/x86/vmlinux.h
      match: "@generated from hack/update-vmlinux"
    - path: internal/pkg/daemon/bpfrecorder/vmlinux/arm64/vmlinux.h
      match: "@generated from hack/update-vmlinux"

  - name: libelf
    version: 0.196
    refPaths:
    - path: hack/install-libelf.sh
      match: "^VERSION="

  # Must be bumped together with libelf above, the checksum of
