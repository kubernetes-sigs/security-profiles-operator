  # The privileged SELinux policy loader of the daemon, pinned by digest so
  # that a moved tag cannot change what runs on every node without a change
  # here. hack/update-selinuxd.sh resolves the current digests, the
  # dependencies workflow fails when they moved.
  - name: selinuxd-digest
    version: sha256:f47bd24fb928bd0d168b86147e3536cf555c94fc5b85de3247fd16dad33f9460
    refPaths:
      - path: deploy/kustomize-deployment/manager_deployment.yaml
        match: "value: quay.io/security-profiles-operator/selinuxd@"
      - path: deploy/helm/values.yaml
        match: "# quay.io/security-profiles-operator/selinuxd:latest$"

