  - name: libelf-sha256
    version: fd5cc6b77ad6773cac93cb3f415f9318ac3b3455eecf801f6b4a742c4f6c7209
    refPaths:
    - path: hack/install-libelf.sh
      match: "^SHA256="

  - name: debian-vmlinux
    version: trixie
    refPaths:
    - path: hack/update-vmlinux
      match: "^VERSION="

  - name: crun
    version: 1.30.1
    upstream:
      flavour: github
      url: containers/crun
    refPaths:
    - path: examples/baseprofile-crun.yaml
      match: "name: crun"
    - path: hack/install-crun
      match: "^CRUN_VERSION="
    - path: hack/ci/kubernix-overlay.nix
      match: "crunVersion ="

  # Must be bumped together with crun above.
  - name: crun-sha256-linux-amd64
    version: 86d1e6a0e76945975d3aebfab39cbc6a26eea15f1c3fc66b6776d19e5dc346a0
    refPaths:
    - path: hack/install-crun
      match: "^CRUN_SHA256_amd64="

  - name: crun-sha256-linux-arm64
    version: 0ef30b0fbb494dc9c5303d46b091a84e27cb8ac99c985123fb1eb339854b69ea
    refPaths:
    - path: hack/install-crun
      match: "^CRUN_SHA256_arm64="

  - name: runc
    version: v1.5.2
    upstream:
      flavour: github
      url: opencontainers/runc
    refPaths:
    - path: examples/baseprofile-runc.yaml
      match: "name: runc"
    - path: doc/profiles.md
      match: "baseProfileName: runc-"
    - path: doc/profiles.md
      match: "base/runc:"
    - path: hack/ci/kubernix-overlay.nix
      match: "runcVersion ="

  - name: kubernix
    version: v0.4.1
    upstream:
      flavour: github
      url: saschagrunert/kubernix
    refPaths:
    - path: hack/ci/install-kubernix.sh
      match: "^KUBERNIX_VERSION="

  - name: cosign
    version: v3.1.3
    upstream:
      flavour: github
      url: sigstore/cosign
    refPaths:
    - path: hack/ci/Vagrantfile-debian
      match: "COSIGN_VERSION="

  # Must be bumped together with cosign above, the same binary as
  # cosign-sha256-linux-amd64 below.
  - name: cosign-sha256-linux-amd64-e2e
    version: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    refPaths:
    - path: hack/ci/Vagrantfile-debian
      match: "COSIGN_SHA256="

  - name: helm
    version: v3.22.0
    upstream:
      flavour: github
      url: helm/helm
      constraints: "< 4.0.0"
    refPaths:
    - path: hack/push-chart.sh
      match: "HELM_VERSION="
    - path: .github/workflows/helm-chart-package.yaml
      match: "version: v3"
    - path: .github/workflows/helm-chart-lint.yaml
      match: "helm: v3"
    - path: .github/workflows/test.yml
      match: "helm: v3"

  # The chart is installed with both major versions, see the helm-install job.
  - name: helm-v4
    version: v4.3.0
    upstream:
      flavour: github
      url: helm/helm
      constraints: ">= 4.0.0"
    refPaths:
    - path: .github/workflows/helm-chart-lint.yaml
      match: "helm: v4"
    - path: .github/workflows/test.yml
      match: "helm: v4"

  # Must be bumped together with helm above.
  - name: helm-sha256-linux-amd64
    version: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
    refPaths:
    - path: hack/push-chart.sh
      match: "^HELM_SHA256="

  - name: cosign for staging signing
