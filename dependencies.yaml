  - name: gcb-docker-gcloud
    version: v20260205-38cfa9523f
    refPaths:
    - path: cloudbuild.yaml
      match: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud

  # Must be bumped together with gcb-docker-gcloud above.
  - name: gcb-docker-gcloud-digest
    version: sha256:ff388e0dc16351e96f8464e2e185b74a7578a5ccb7a112cf3393468e59e6e2d2
    refPaths:
    - path: cloudbuild.yaml
      match: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud

  # The BuildKit of the reproducible image builds, on Cloud Build and in the
  # image-reproducible workflow alike.
  - name: buildkit
    version: v0.33.1
    upstream:
      flavour: github
      url: moby/buildkit
    refPaths:
    - path: hack/image-cross.sh
      match: "^BUILDKIT_VERSION="

  # Must be bumped together with buildkit above.
  - name: buildkit-digest
    version: sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    refPaths:
