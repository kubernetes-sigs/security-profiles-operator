    upstream:
      flavour: github
      url: sigstore/cosign
    refPaths:
    - path: hack/lib/common.sh
      match: "^COSIGN_VERSION="

  # Must be bumped together with cosign for staging signing above.
  - name: cosign-sha256-linux-amd64
    version: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    refPaths:
    - path: hack/lib/common.sh
      match: "^COSIGN_SHA256="

  - name: bom
    version: v0.8.0
    upstream:
      flavour: github
      url: kubernetes-sigs/bom
    refPaths:
    - path: hack/lib/common.sh
      match: "^BOM_VERSION="

  # Must be bumped together with bom above.
  - name: bom-sha256-amd64-linux
    version: cafd00b75a8df860fec54d19b9e24fb48556c0848d0abf9e40cd2eabb11a8710
