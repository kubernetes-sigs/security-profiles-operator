    upstream:
      flavour: github
      url: containernetworking/plugins
    refPaths:
    - path: hack/ci/Vagrantfile-flatcar
      match: "^ *CNI_VERSION="

  # Must be bumped together with e2e-flatcar-cni-plugins above.
  - name: e2e-flatcar-cni-plugins-sha256
    version: b98f74a0f8522f0a83867178729c1aa70f2158f90c45a2ca8fa791db1c76b303
    refPaths:
    - path: hack/ci/Vagrantfile-flatcar
      match: "^ *CNI_SHA256="

  # The kubelet systemd units of kubernetes/release.
  - name: e2e-flatcar-kubernetes-release
    version: v0.21.1
    refPaths:
    - path: hack/ci/Vagrantfile-flatcar
      match: "^ *RELEASE_VERSION="

  # Must be bumped together with e2e-flatcar-kubernetes-release above.
  - name: e2e-flatcar-kubelet-service-sha256
    version: ccc966cee3d366b3e9ca0fe3f603b09218a0d5ed01e54f9cae953208f411141f
    refPaths:
    - path: hack/ci/Vagrantfile-flatcar
      match: "^ *KUBELET_SERVICE_SHA256="

  - name: e2e-flatcar-kubeadm-conf-sha256
    version: 46458e5b4adf851099e591acb3248931fc5f4073976fedb11c49d6bfad5c41a8
    refPaths:
    - path: hack/ci/Vagrantfile-flatcar
      match: "^ *KUBEADM_CONF_SHA256="

  - name: e2e-debian-box
    version: 4.3.12
    refPaths:
    - path: hack/ci/Vagrantfile-debian
      match: "config.vm.box_version = "

  - name: e2e-fedora
    version: 44
    refPaths:
    - path: hack/ci/Vagrantfile-fedora
      match: 'config.vm.box = '

  - name: e2e-fedora-image-url
    version: 44-1.7
    refPaths:
      - path: hack/ci/Vagrantfile-fedora
        match: Fedora-Cloud-Base-Vagrant

  - name: debian-base-digest
    version: sha256:bb933ac3606ff3f69854a7eba5da1eaef5064ef62d83f3cb0e4be40eb53522e0
    refPaths:
    - path: Dockerfile.build-image
      match: registry.k8s.io/build-image/debian-base

  - name: debian-base
    version: bookworm-v1.0.8
    refPaths:
    - path: Dockerfile.build-image
      match: tag

  - name: build-image
    version: sha256:dc669ccf589a45079e01d3b7d0ed58a68e60492f62a2caf7acb25a7ca5cf412f
    refPaths:
    - path: Dockerfile
      match: "^ARG BUILD_IMAGE="

  - name: nix
    version: 2.35.2
    upstream:
      flavour: github
