  - name: e2e-flatcar-calico-sha256
    version: 4e372754e4e1c3a61cf7c0ceb9bc9fff2f78aa6575dcadcb5ea4e716bb00dffa
    refPaths:
    - path: hack/ci/Vagrantfile-flatcar
      match: "^ *CALICO_SHA256="

  # Must be bumped together with e2e-flatcar-calico above, the checksum of
