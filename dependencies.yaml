    - path: hack/ci/Vagrantfile-flatcar
      match: "^ *JQ_VERSION="

  # Must be bumped together with jq above.
  - name: jq-sha256-linux-amd64
    version: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
    refPaths:
    - path: hack/lib/common.sh
      match: "^JQ_SHA256="
    - path: hack/ci/Vagrantfile-flatcar
      match: "^ *JQ_SHA256="

  - name: crane for staging attestations
    version: v0.22.1
    upstream:
      flavour: github
      url: google/go-containerregistry
    refPaths:
    - path: hack/lib/common.sh
      match: "^CRANE_VERSION="

  # nix brings its own Go, make verify-go-version checks that it matches.
  - name: golang
    version: 1.27.1
    refPaths:
    - path: go.mod
      match: "^toolchain go"
    - path: cloudbuild.yaml
      match: "name: golang:"
    - path: .devcontainer/devcontainer.json
      match: '"version": "1\.'

  # The release the upgrade e2e test starts from when git has no tags.
  - name: spo-previous-release
    version: 1.1.0
    upstream:
      flavour: github
      url: kubernetes-sigs/security-profiles-operator
    refPaths:
    - path: test/tc_upgrade_test.go
      match: "fallbackPreviousRelease = \"v"

  - name: spo-current
    version: 1.1.1-dev
    refPaths:
    - path: VERSION
      match: ^.*
    - path: bundle/manifests/security-profiles-operator.clusterserviceversion.yaml
      match: "^  name: security-profiles-operator"
    - path: deploy/helm/Chart.yaml
      match: "^appVersion: "
    - path: deploy/helm/Chart.yaml
      match: "^version: "
    - path: deploy/helm/README.md
      match: "Version-"
    - path: deploy/helm/README.md
      match: "AppVersion-"

  - name: clang-bpf
    version: 19
