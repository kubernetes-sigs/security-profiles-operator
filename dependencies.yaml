dependencies:
  - name: golangci-lint
    version: 2.14.0
    upstream:
      flavour: github
      url: golangci/golangci-lint
    refPaths:
    - path: Makefile
      match: "^GOLANGCI_LINT_VERSION"
    - path: .custom-gcl.yml
      match: "^version:"

  - name: kube-api-linter
    version: v0.0.0-20260716143926-092fe0c72997
    refPaths:
    - path: Makefile
      match: KAL_VERSION
    - path: .custom-gcl.yml
      match: "version: 'v0.0.0"

  - name: repo-infra
    version: v0.2.6
    refPaths:
    - path: Makefile
      match: "^REPO_INFRA_VERSION"

  - name: kustomize
    version: 5.8.1
    refPaths:
    - path: Makefile
      match: "^KUSTOMIZE_VERSION"

  - name: operator-sdk
    version: v1.42.3
    upstream:
      flavour: github
      url: operator-framework/operator-sdk
    refPaths:
    - path: Makefile
      match: "^OPERATOR_SDK_VERSION"

  # Must be bumped together with operator-sdk above.
  - name: operator-sdk-sha256-linux-amd64
    version: 887a3bb0d63ccc4ca47a522d0c8ffac56d9d5246f6a2bd886b4ed23eb2e2672f
    refPaths:
    - path: Makefile
      match: "^OPERATOR_SDK_SHA256_linux_amd64"

  - name: operator-sdk-sha256-linux-arm64
    version: 6db93cd821b429f0bb514cea4bbb5553827d273fc8aa211f13e14798599d31cd
    refPaths:
    - path: Makefile
      match: "^OPERATOR_SDK_SHA256_linux_arm64"

  - name: operator-sdk-sha256-darwin-amd64
    version: 7cb0f24bb63b6383a117291ee4c808953c5dd789d5877da98051aa68b41f40ac
    refPaths:
    - path: Makefile
      match: "^OPERATOR_SDK_SHA256_darwin_amd64"

  - name: operator-sdk-sha256-darwin-arm64
    version: 098ae8b9dbe7dfd557e8e7ed0f1996736922dd4b984621df2aa033f225cae161
    refPaths:
    - path: Makefile
      match: "^OPERATOR_SDK_SHA256_darwin_arm64"

  - name: opm
    version: v1.74.0
    upstream:
      flavour: github
      url: operator-framework/operator-registry
    refPaths:
    - path: Makefile
      match: "^OPM_VERSION"

  # Must be bumped together with opm above.
  - name: opm-sha256-linux-amd64
    version: cf1bd699be72e0a4511208afdf45444fc47d21eb2ffed0c204520ff50b5a4691
    refPaths:
    - path: Makefile
      match: "^OPM_SHA256_linux_amd64"

  - name: opm-sha256-linux-arm64
    version: 348a9682975eb220bea3b98b83aa82dc6d2630e6868331ed9bf14f97e462d8be
    refPaths:
    - path: Makefile
      match: "^OPM_SHA256_linux_arm64"

  - name: opm-sha256-darwin-amd64
    version: a448e5972689036cb1168b83e18195b193bb513399c234d402c425b073a52ea6
    refPaths:
    - path: Makefile
      match: "^OPM_SHA256_darwin_amd64"

  - name: opm-sha256-darwin-arm64
    version: 0ce2671c543e637ae24cb98dfeeec1a9554e3955a72c59eb872750eaf915627f
    refPaths:
    - path: Makefile
      match: "^OPM_SHA256_darwin_arm64"

  # Must be bumped together with opm above.
  - name: opm-image-digest
    version: sha256:b32d3891616662620da08d7f0ec42c2e69fa2de43427dc975d35b12f7a969a0f
    refPaths:
    - path: Makefile
      match: "^OPM_IMAGE"

  - name: olm
    version: v0.46.0
    upstream:
      flavour: github
      url: operator-framework/operator-lifecycle-manager
    refPaths:
    - path: hack/ci/e2e-olm.sh
      match: "^OLM_VERSION"

  - name: cert-manager
    version: 1.21.2
    upstream:
      flavour: github
      url: cert-manager/cert-manager
    refPaths:
    - path: test/e2e_test.go
      match: cert-manager/cert-manager
    - path: doc/installation.md
      match: cert-manager/cert-manager
    - path: hack/ci/e2e-olm.sh
      match: cert-manager/cert-manager
    - path: hack/ci/install-spo.sh
      match: cert-manager/cert-manager
    - path: hack/ci/install-helm-chart.sh
      match: ^CERT_MANAGER_VERSION

  - name: kind
    version: 0.33.0
    upstream:
      flavour: github
      url: kubernetes-sigs/kind
    refPaths:
    - path: test/suite_test.go
      match: 'kindVersion\s+='

  - name: kind-image
    version: 1.37.0
    refPaths:
    - path: test/suite_test.go
      match: 'kindImage\s+='
    - path: .github/workflows/olm_tests.yaml
      match: KIND_IMG_TAG
    - path: .github/workflows/test.yml
      match: KIND_IMG_TAG

  - name: minimum-kubernetes
    version: 1.30
    refPaths:
    - path: deploy/helm/Chart.yaml
      match: "^kubeVersion:"
    - path: doc/installation.md
      match: "The operator requires Kubernetes v"
    - path: CONTRIBUTING.md
      match: "Access to a Kubernetes v"
    - path: CONTRIBUTING.md
      match: "kubectl.*version v"
    - path: deploy/base/clusterserviceversion.yaml
      match: "minKubeVersion:"

  - name: e2e-kubernetes
    version: 1.37
    refPaths:
    - path: hack/ci/Vagrantfile-fedora
      match: "KUBERNETES_VERSION="
    - path: hack/ci/Vagrantfile-debian
      match: "KUBERNETES_VERSION="

  - name: e2e-debian-box
    version: 4.3.12
    refPaths:
    - path: hack/ci/Vagrantfile-debian
      match: "config.vm.box_version = "

  - name: e2e-fedora
    version: 44
    refPaths:
    - path: hack/ci/Vagrantfile-fedora
      match: 'config.vm.box = '

  - name: e2e-fedora-image-url
    version: 44-1.7
    refPaths:
      - path: hack/ci/Vagrantfile-fedora
        match: Fedora-Cloud-Base-Vagrant

  - name: debian-base-digest
    version: sha256:bb933ac3606ff3f69854a7eba5da1eaef5064ef62d83f3cb0e4be40eb53522e0
    refPaths:
    - path: Dockerfile.build-image
      match: registry.k8s.io/build-image/debian-base

  - name: debian-base
    version: bookworm-v1.0.8
    refPaths:
    - path: Dockerfile.build-image
      match: tag

  - name: build-image
    version: sha256:4eb34d389b920396114362cdf2ad8a56cb6e95cc471295ec40f9faf9d1a9a188
    refPaths:
    - path: Dockerfile
      match: "^ARG BUILD_IMAGE="

  - name: nix
    version: 2.35.2
    upstream:
      flavour: github
      url: NixOS/nix
    refPaths:
    - path: Dockerfile.build-image
      match: "^ARG NIX_VERSION"
    - path: .github/workflows/build.yml
      match: "NIX_VERSION:"

  # Must be bumped together with nix above.
  - name: nix-sha256
    version: 0c3960a9792331a22081c3c7a5d8465db9b17c50b3acdf18587fa4c6f2cb1158
    refPaths:
    - path: Dockerfile.build-image
      match: "^ARG NIX_SHA256"

  - name: gcb-docker-gcloud
    version: v20260205-38cfa9523f
    refPaths:
    - path: cloudbuild.yaml
      match: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud

  # Must be bumped together with gcb-docker-gcloud above.
  - name: gcb-docker-gcloud-digest
    version: sha256:ff388e0dc16351e96f8464e2e185b74a7578a5ccb7a112cf3393468e59e6e2d2
    refPaths:
    - path: cloudbuild.yaml
      match: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud

  - name: libbpf
    version: 1.7.0
    upstream:
      flavour: github
      url: libbpf/libbpf
    refPaths:
    - path: hack/install-libbpf.sh
      match: "^VERSION="

  - name: libelf
    version: 0.196
    refPaths:
    - path: hack/install-libelf.sh
      match: "^VERSION="

  - name: debian-vmlinux
    version: trixie
    refPaths:
    - path: hack/update-vmlinux
      match: "^VERSION="

  - name: crun
    version: 1.30
    upstream:
      flavour: github
      url: containers/crun
    refPaths:
    - path: examples/baseprofile-crun.yaml
      match: "name: crun"
    - path: hack/install-crun
      match: "^CRUN_VERSION="
    - path: hack/ci/kubernix-overlay.nix
      match: "crunVersion ="

  - name: runc
    version: v1.5.1
    upstream:
      flavour: github
      url: opencontainers/runc
    refPaths:
    - path: examples/baseprofile-runc.yaml
      match: "name: runc"
    - path: doc/profiles.md
      match: "baseProfileName: runc-"
    - path: doc/profiles.md
      match: "base/runc:"
    - path: hack/ci/kubernix-overlay.nix
      match: "runcVersion ="

  - name: kubernix
    version: v0.4.1
    upstream:
      flavour: github
      url: saschagrunert/kubernix
    refPaths:
    - path: hack/ci/install-kubernix.sh
      match: "^KUBERNIX_VERSION="

  - name: cosign
    version: v3.1.3
    upstream:
      flavour: github
      url: sigstore/cosign
    refPaths:
    - path: hack/ci/Vagrantfile-debian
      match: "COSIGN_VERSION="

  - name: helm
    version: v3.22.0
    upstream:
      flavour: github
      url: helm/helm
      constraints: "< 4.0.0"
    refPaths:
    - path: hack/push-chart.sh
      match: "HELM_VERSION="
    - path: .github/workflows/helm-chart-package.yaml
      match: "version: v3"
    - path: .github/workflows/helm-chart-lint.yaml
      match: "version: v3"
    - path: .github/workflows/test.yml
      match: "version: v3"

  # Must be bumped together with helm above.
  - name: helm-sha256-linux-amd64
    version: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
    refPaths:
    - path: hack/push-chart.sh
      match: "^HELM_SHA256="

  - name: cosign for staging signing
    version: v3.1.3
    upstream:
      flavour: github
      url: sigstore/cosign
    refPaths:
    - path: hack/lib/common.sh
      match: "^COSIGN_VERSION="

  # Must be bumped together with cosign for staging signing above.
  - name: cosign-sha256-linux-amd64
    version: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    refPaths:
    - path: hack/lib/common.sh
      match: "^COSIGN_SHA256="

  - name: bom
    version: v0.8.0
    upstream:
      flavour: github
      url: kubernetes-sigs/bom
    refPaths:
    - path: hack/lib/common.sh
      match: "^BOM_VERSION="

  # Must be bumped together with bom above.
  - name: bom-sha256-amd64-linux
    version: cafd00b75a8df860fec54d19b9e24fb48556c0848d0abf9e40cd2eabb11a8710
    refPaths:
    - path: hack/lib/common.sh
      match: "^BOM_SHA256="

  - name: jq
    version: 1.8.2
    refPaths:
    - path: hack/lib/common.sh
      match: "^JQ_VERSION="

  # Must be bumped together with jq above.
  - name: jq-sha256-linux-amd64
    version: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
    refPaths:
    - path: hack/lib/common.sh
      match: "^JQ_SHA256="

  - name: crane for staging attestations
    version: v0.22.1
    upstream:
      flavour: github
      url: google/go-containerregistry
    refPaths:
    - path: hack/lib/common.sh
      match: "^CRANE_VERSION="

  # nix brings its own Go, make verify-go-version checks that it matches.
  - name: golang
    version: 1.27.1
    refPaths:
    - path: go.mod
      match: "^toolchain go"
    - path: cloudbuild.yaml
      match: "name: golang:"

  - name: spo-current
    version: 1.1.1-dev
    refPaths:
    - path: VERSION
      match: ^.*
    - path: bundle/manifests/security-profiles-operator.clusterserviceversion.yaml
      match: "^  name: security-profiles-operator"
    - path: deploy/helm/Chart.yaml
      match: "^appVersion: "
    - path: deploy/helm/Chart.yaml
      match: "^version: "
    - path: deploy/helm/README.md
      match: "Version-"
    - path: deploy/helm/README.md
      match: "AppVersion-"

  - name: clang-bpf
    version: 19
    refPaths:
    - path: nix/derivation-bpf.nix
      match: llvmPackages_\d+.clang-unwrapped
    - path: nix/derivation-bpf.nix
      match: llvm_\d+

  - name: clang-ci
    version: 23
    refPaths:
    - path: hack/pull-security-profiles-operator-verify
      match: "^CLANG_VERSION="

  - name: flatcar
    version: 3510.2.3
    refPaths:
    - path: hack/ci/Vagrantfile-flatcar
      match: flatcar_production_vagrant
    - path: hack/ci/Vagrantfile-flatcar
      match: flatcar_developer_container.bin.bz2"$

  - name: zeitgeist
    version: 0.8.0
    upstream:
      flavour: github
      url: kubernetes-sigs/zeitgeist
    refPaths:
      - path: Makefile
        match: "^ZEITGEIST_VERSION"

  - name: mdtoc
    version: v1.4.0
    upstream:
      flavour: github
      url: kubernetes-sigs/mdtoc
    refPaths:
      - path: Makefile
        match: "^MDTOC_VERSION"

  - name: govulncheck
    version: v1.8.0
    refPaths:
      - path: Makefile
        match: "^GOVULNCHECK_VERSION"
      - path: hack/lib/common.sh
        match: "^GOVULNCHECK_VERSION="

  - name: gotestsum
    version: v1.13.0
    upstream:
      flavour: github
      url: gotestyourself/gotestsum
    refPaths:
      - path: Makefile
        match: "^GOTESTSUM_VERSION"

  - name: python for chart-testing
    version: 3.13
    refPaths:
      - path: .github/workflows/helm-chart-lint.yaml
        match: "python-version:"

  - name: trivy
    version: v0.74.0
    upstream:
      flavour: github
      url: aquasecurity/trivy
    refPaths:
      - path: .github/workflows/build.yml
        match: "version: v0\\."

  - name: yq
    version: 4.53.6
    upstream:
      flavour: github
      url: mikefarah/yq
    refPaths:
      - path: hack/ci/install-yq.sh
        match: "YQ_VERSION="
