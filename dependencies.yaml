dependencies:
  - name: golangci-lint
    version: 2.13.1
    refPaths:
    - path: Makefile
      match: "^GOLANGCI_LINT_VERSION"
    - path: .custom-gcl.yml
      match: "^version:"

  - name: kube-api-linter
    version: v0.0.0-20260716143926-092fe0c72997
    refPaths:
    - path: Makefile
      match: KAL_VERSION
    - path: .custom-gcl.yml
      match: "version: 'v0.0.0"

  - name: repo-infra
    version: v0.2.6
    refPaths:
    - path: Makefile
      match: "^REPO_INFRA_VERSION"

  - name: kustomize
    version: 5.8.1
    refPaths:
    - path: Makefile
      match: "^KUSTOMIZE_VERSION"

  - name: operator-sdk
    version: v1.42.3
    refPaths:
    - path: Makefile
      match: "^OPERATOR_SDK_VERSION"

  - name: opm
    version: v1.73.0
    refPaths:
    - path: Makefile
      match: "^OPM_VERSION"

  - name: olm
    version: v0.46.0
    refPaths:
    - path: hack/ci/e2e-olm.sh
      match: "^OLM_VERSION"

  - name: cert-manager
    version: 1.21.1
    refPaths:
    - path: test/e2e_test.go
      match: cert-manager/cert-manager
    - path: installation-usage.md
      match: cert-manager/cert-manager
    - path: hack/ci/e2e-olm.sh
      match: cert-manager/cert-manager
    - path: hack/ci/install-spo.sh
      match: cert-manager/cert-manager

  - name: kind
    version: 0.32.0
    refPaths:
    - path: test/suite_test.go
      match: 'kindVersion\s+='

  - name: kind-image
    version: 1.36.1
    refPaths:
    - path: test/suite_test.go
      match: 'kindImage\s+='
    - path: .github/workflows/olm_tests.yaml
      match: KIND_IMG_TAG

  - name: e2e-kubernetes
    version: 1.36
    refPaths:
    - path: hack/ci/Vagrantfile-fedora
      match: "KUBERNETES_VERSION="
    - path: hack/ci/Vagrantfile-ubuntu
      match: "KUBERNETES_VERSION="
    - path: hack/ci/Vagrantfile-debian
      match: "KUBERNETES_VERSION="

  - name: e2e-fedora
    version: 39
    refPaths:
    - path: hack/ci/Vagrantfile-fedora
      match: 'config.vm.box = '

  - name: e2e-fedora-image-url
    version: 39-1.5
    refPaths:
      - path: hack/ci/Vagrantfile-fedora
        match: Fedora-Cloud-Base-Vagrant

  - name: e2e-ubuntu
    version: ubuntu2204
    refPaths:
    - path: hack/ci/Vagrantfile-ubuntu
      match: config.vm.box

  - name: debian-base-digest
    version: sha256:0a17678966f63e82e9c5e246d9e654836a33e13650a698adefede61bb5ca099e
    refPaths:
    - path: Dockerfile.build-image
      match: registry.k8s.io/build-image/debian-base

  - name: debian-base
    version: bookworm-v1.0.4
    refPaths:
    - path: Dockerfile.build-image
      match: tag

  - name: nix
    version: 2.35.2
    refPaths:
    - path: Dockerfile.build-image
      match: "^ARG NIX_VERSION"
    - path: .github/workflows/build.yml
      match: "NIX_VERSION:"

  - name: gcb-docker-gcloud
    version: v20260205-38cfa9523f
    refPaths:
    - path: cloudbuild.yaml
      match: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud

  - name: libbpf
    version: 1.7.0
    refPaths:
    - path: hack/install-libbpf.sh
      match: "^VERSION="

  - name: libelf
    version: 0.193
    refPaths:
    - path: hack/install-libelf.sh
      match: "^VERSION="

  - name: debian-vmlinux
    version: trixie
    refPaths:
    - path: hack/update-vmlinux
      match: "^VERSION="

  - name: crun
    version: 1.29.1
    refPaths:
    - path: examples/baseprofile-crun.yaml
      match: "name: crun"
    - path: test/tc_base_profiles_test.go
      match: 'baseProfileNameCrun\s+='
    - path: hack/install-crun
      match: "^CRUN_VERSION="

  - name: runc
    version: v1.5.1
    refPaths:
    - path: examples/baseprofile-runc.yaml
      match: "name: runc"
    - path: test/tc_base_profiles_test.go
      match: 'baseProfileNameRunc\s+='
    - path: installation-usage.md
      match: "baseProfileName: runc"

  - name: cosign
    version: v2.6.5
    refPaths:
    - path: hack/ci/Vagrantfile-ubuntu
      match: "COSIGN_VERSION="
    - path: hack/ci/Vagrantfile-debian
      match: "COSIGN_VERSION="

  - name: bom
    version: v0.7.1
    refPaths:
    - path: .github/workflows/build.yml
      match: "BOM_VERSION:"

  - name: spo-current
    version: 1.0.2-dev
    refPaths:
    - path: VERSION
      match: ^.*
    - path: bundle/manifests/security-profiles-operator.clusterserviceversion.yaml
      match: "^  name: security-profiles-operator"
    - path: deploy/helm/Chart.yaml
      match: "^appVersion: "
    - path: deploy/helm/Chart.yaml
      match: "^version: "

  - name: clang-bpf
    version: 19
    refPaths:
    - path: nix/derivation-bpf.nix
      match: llvmPackages_\d+.clang-unwrapped
    - path: nix/derivation-bpf.nix
      match: llvm_\d+

  - name: clang-ci
    version: 21
    refPaths:
    - path: hack/pull-security-profiles-operator-verify
      match: "^CLANG_VERSION="

  - name: flatcar
    version: 3510.2.3
    refPaths:
    - path: hack/ci/Vagrantfile-flatcar
      match: flatcar_production_vagrant
    - path: hack/ci/Vagrantfile-flatcar
      match: flatcar_developer_container.bin.bz2"$

  - name: zeitgeist
    version: 0.8.0
    refPaths:
      - path: Makefile
        match: "^ZEITGEIST_VERSION"

  - name: mdtoc
    version: v1.4.0
    refPaths:
      - path: Makefile
        match: "^MDTOC_VERSION"

  - name: yq
    version: 4.53.6
    refPaths:
      - path: hack/ci/install-yq.sh
        match: "YQ_VERSION="
