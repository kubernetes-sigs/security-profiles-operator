dependencies:
  - name: golangci-lint
    version: 2.14.0
    upstream:
      flavour: github
      url: golangci/golangci-lint
    refPaths:
    - path: Makefile
      match: "^GOLANGCI_LINT_VERSION"
    - path: .custom-gcl.yml
      match: "^version:"

  # Must be bumped together with golangci-lint above, see
  # golangci-lint-<version>-checksums.txt of the release.
  - name: golangci-lint-sha256-linux-amd64
    version: ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab
    refPaths:
    - path: Makefile
      match: "^GOLANGCI_LINT_SHA256_linux_amd64"

  - name: golangci-lint-sha256-linux-arm64
    version: ee7ec5f3453d15ddf106fae5a4d6c71737712348a979d1fe9cd52ec7ea299bae
    refPaths:
    - path: Makefile
      match: "^GOLANGCI_LINT_SHA256_linux_arm64"

  - name: golangci-lint-sha256-darwin-amd64
    version: a5667c1c3536be1740133213e1e822bfb8f0d98ea12903174d6d5f635e4ed68d
    refPaths:
    - path: Makefile
      match: "^GOLANGCI_LINT_SHA256_darwin_amd64"

  - name: golangci-lint-sha256-darwin-arm64
    version: 5ef5f36a7147e91dc58ef9ef4d11bb7bad5ead0c76eb6c01327a73c641d1dcc3
    refPaths:
    - path: Makefile
      match: "^GOLANGCI_LINT_SHA256_darwin_arm64"

  - name: kube-api-linter
    version: v0.0.0-20260716143926-092fe0c72997
    refPaths:
    - path: Makefile
      match: KAL_VERSION
    - path: .custom-gcl.yml
      match: "version: 'v0.0.0"

  - name: repo-infra
    version: v0.2.6
    refPaths:
    - path: Makefile
      match: "^REPO_INFRA_VERSION"

  # Must be bumped together with repo-infra above, the checksum of
  # hack/verify_boilerplate.py at that tag.
  - name: repo-infra-verify-boilerplate-sha256
    version: 3ee0139a0a2865ad2e9674012a2459d56f4009844aa1b430119d0da4c603da95
    refPaths:
    - path: Makefile
      match: "^VERIFY_BOILERPLATE_SHA256"

  - name: kustomize
    version: 5.8.1
    upstream:
      flavour: github
      url: kubernetes-sigs/kustomize
      constraints: "< 6.0.0"
    refPaths:
    - path: Makefile
      match: "^KUSTOMIZE_VERSION"

  - name: operator-sdk
    version: v1.42.3
    upstream:
      flavour: github
      url: operator-framework/operator-sdk
    refPaths:
    - path: Makefile
