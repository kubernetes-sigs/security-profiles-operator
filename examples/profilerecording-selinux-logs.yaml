---
apiVersion: security-profiles-operator.x-k8s.io/v1
kind: ProfileRecording
metadata:
  # Each recorded container results in a `SelinuxProfile` named
  # `<recording name>-<container name>`. Profiles are cluster scoped, so use a
  # recording name which is unique across all namespaces.
  name: test-selinux-recording
spec:
  kind: SelinuxProfile
  recorder: Logs
  podSelector:
    matchLabels:
      app: alpine
