---
# See https://cloud.google.com/cloud-build/docs/build-config
timeout: 2400s
serviceAccount: projects/k8s-staging-images/serviceAccounts/sp-operator-sa@k8s-staging-images.iam.gserviceaccount.com
options:
  substitution_option: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8
steps:
  - name: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud:v20260205-38cfa9523f@sha256:ff388e0dc16351e96f8464e2e185b74a7578a5ccb7a112cf3393468e59e6e2d2
    entrypoint: bash
    env:
      - TAG=$_GIT_TAG
      - HOME=/root  # for docker buildx
    args:
    - -c
    # Tools on containers/image need a signature policy. Only the staging
    # repository, from which the catalog is rendered by the digest this build
    # pushed, is accepted without signature, everything else is rejected.
    - |
      mkdir -p /etc/containers && \
      echo '{"default": [{"type": "reject"}], "transports": {"docker": {"us-central1-docker.pkg.dev/k8s-staging-images/sp-operator": [{"type": "insecureAcceptAnything"}]}, "docker-daemon": {"": [{"type": "insecureAcceptAnything"}]}}}' > /etc/containers/policy.json && \
      gcloud auth configure-docker us-central1-docker.pkg.dev --quiet && \
      make image-cross
  - name: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud:v20260205-38cfa9523f@sha256:ff388e0dc16351e96f8464e2e185b74a7578a5ccb7a112cf3393468e59e6e2d2
    entrypoint: bash
    env:
      - REGISTRY=us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator
      - USERNAME=oauth2accesstoken
      - TAG=$_GIT_TAG
      - BUILD_ID=$BUILD_ID
      - PROJECT_ID=$PROJECT_ID
      - PROJECT_NUMBER=$PROJECT_NUMBER
      - SERVICE_ACCOUNT_EMAIL=$SERVICE_ACCOUNT_EMAIL
      # Only signatures of the build account count for already published
      # profiles, others get signed again.
      - SIGNER_IDENTITY_REGEXP=^sp-operator-sa@$PROJECT_ID\.iam\.gserviceaccount\.com$$
      - SIGNER_OIDC_ISSUER_REGEXP=^https://accounts\.google\.com$$
    args:
    - -c
    - |
      IMAGE=us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator/security-profiles-operator-amd64:$_GIT_TAG && \
      CONTAINER=$$(docker create $$IMAGE) && \
      mkdir -p build && \
      docker cp $$CONTAINER:/spoc build/spoc && \
      docker rm $$CONTAINER && \
      export PASSWORD=$$(gcloud auth print-access-token) && \
      ./hack/push-test-artifacts.sh && \
      ./hack/push-base-profiles.sh && \
      ./hack/push-chart.sh
  # Attesting runs last, so that a failure there doesn't keep the profiles and
  # the chart from being published.
  - name: golang:1.27.1-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
    entrypoint: bash
    env:
      - TAG=$_GIT_TAG
      - BUILD_ID=$BUILD_ID
      - PROJECT_ID=$PROJECT_ID
      - PROJECT_NUMBER=$PROJECT_NUMBER
      - SERVICE_ACCOUNT_EMAIL=$SERVICE_ACCOUNT_EMAIL
    args:
    - -c
    - ./hack/attest-images.sh
substitutions:
  # _GIT_TAG will be filled with a git-based tag for the image, of the form
  # vYYYYMMDD-hash, and can be used as a substitution
  _GIT_TAG: '12345'
