---
# See https://cloud.google.com/cloud-build/docs/build-config
timeout: 1800s
serviceAccount: projects/k8s-staging-images/serviceAccounts/sp-operator-sa@k8s-staging-images.iam.gserviceaccount.com
options:
  substitution_option: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8
steps:
  - name: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud:v20260205-38cfa9523f
    entrypoint: bash
    env:
      - TAG=$_GIT_TAG
      - HOME=/root  # for docker buildx
    args:
    - -c
    - |
      mkdir -p /etc/containers && \
      echo '{"default": [{"type": "insecureAcceptAnything"}]}' > /etc/containers/policy.json && \
      gcloud auth configure-docker us-central1-docker.pkg.dev --quiet && \
      make image-cross
  - name: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud:v20260205-38cfa9523f
    entrypoint: bash
    env:
      - REGISTRY=us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator
      - USERNAME=oauth2accesstoken
      # Only signatures of the build account count for already published
      # profiles, others get signed again.
      - SIGNER_IDENTITY_REGEXP=^sp-operator-sa@$PROJECT_ID\.iam\.gserviceaccount\.com$$
      - SIGNER_OIDC_ISSUER_REGEXP=^https://accounts\.google\.com$$
    args:
    - -c
    - |
      IMAGE=us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator/security-profiles-operator-amd64:$_GIT_TAG && \
      CONTAINER=$$(docker create $$IMAGE) && \
      mkdir -p build && \
      docker cp $$CONTAINER:/spoc build/spoc && \
      docker rm $$CONTAINER && \
      export PASSWORD=$$(gcloud auth print-access-token) && \
      ./hack/push-test-artifacts.sh && \
      ./hack/push-base-profiles.sh && \
      ./hack/push-chart.sh
substitutions:
  # _GIT_TAG will be filled with a git-based tag for the image, of the form
  # vYYYYMMDD-hash, and can be used as a substitution
  _GIT_TAG: '12345'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator/security-profiles-operator-amd64:$_GIT_TAG'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator/security-profiles-operator-amd64:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator/security-profiles-operator-catalog:$_GIT_TAG'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator/security-profiles-operator-catalog:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator/security-profiles-operator-bundle:$_GIT_TAG'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator/security-profiles-operator-bundle:latest'
