---
# See https://cloud.google.com/cloud-build/docs/build-config
timeout: 2400s
serviceAccount: projects/k8s-staging-images/serviceAccounts/sp-operator-sa@k8s-staging-images.iam.gserviceaccount.com
options:
  substitution_option: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8
steps:
  - name: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud:v20260205-38cfa9523f@sha256:ff388e0dc16351e96f8464e2e185b74a7578a5ccb7a112cf3393468e59e6e2d2
    entrypoint: bash
    env:
      - TAG=$_GIT_TAG
      - HOME=/root  # for docker buildx
    args:
    - -c
    # Tools on containers/image need a signature policy. Only the staging
    # repository, from which the catalog is rendered by the digest this build
    # pushed, is accepted without signature, everything else is rejected.
    - |
      mkdir -p /etc/containers && \
      echo '{"default": [{"type": "reject"}], "transports": {"docker": {"us-central1-docker.pkg.dev/k8s-staging-images/sp-operator": [{"type": "insecureAcceptAnything"}]}, "docker-daemon": {"": [{"type": "insecureAcceptAnything"}]}}}' > /etc/containers/policy.json && \
      gcloud auth configure-docker us-central1-docker.pkg.dev --quiet && \
      make image-cross
  - name: gcr.io/k8s-staging-test-infra/gcb-docker-gcloud:v20260205-38cfa9523f@sha256:ff388e0dc16351e96f8464e2e185b74a7578a5ccb7a112cf3393468e59e6e2d2
    entrypoint: bash
    env:
      - REGISTRY=us-central1-docker.pkg.dev/$PROJECT_ID/sp-operator
      - TAG=$_GIT_TAG
      - BUILD_ID=$BUILD_ID
      - PROJECT_ID=$PROJECT_ID
      - PROJECT_NUMBER=$PROJECT_NUMBER
      - SERVICE_ACCOUNT_EMAIL=$SERVICE_ACCOUNT_EMAIL
      # Only signatures of the build account count for already published
      # profiles, others get signed again.
      - SIGNER_IDENTITY_REGEXP=^sp-operator-sa@$PROJECT_ID\.iam\.gserviceaccount\.com$$
      - SIGNER_OIDC_ISSUER_REGEXP=^https://accounts\.google\.com$$
    # registry_login fetches the access token itself and writes it to a
    # temporary DOCKER_CONFIG, which spoc, helm and cosign read, so that the
    # token never gets into the environment of the step. spoc comes from the
    # amd64 image of this build, by the digest the provenance of the profiles
    # names. The scripts run independently, so that a failure to sign or
    # attest something already published doesn't keep the others from
    # publishing, and the step fails at the end.
    args:
    - -c
    - |
      SPOC_IMAGE=$$(grep -F -- '-amd64@sha256:' build/image-digests) && \
      export SPOC_IMAGE && \
      CONTAINER=$$(docker create $$SPOC_IMAGE) && \
      mkdir -p build && \
      docker cp $$CONTAINER:/spoc build/spoc && \
      docker rm $$CONTAINER && \
      source hack/lib/common.sh && \
      registry_login us-central1-docker.pkg.dev || exit 1
      status=0
      ./hack/push-test-artifacts.sh || status=1
      ./hack/push-base-profiles.sh || status=1
      ./hack/push-chart.sh || status=1
      exit $$status
  # Attesting runs after publishing, so that a failure there doesn't keep the
  # profiles and the chart from being published.
  - name: golang:1.27.2-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
    entrypoint: bash
    env:
      - TAG=$_GIT_TAG
      - BUILD_ID=$BUILD_ID
      - PROJECT_ID=$PROJECT_ID
      - PROJECT_NUMBER=$PROJECT_NUMBER
      - SERVICE_ACCOUNT_EMAIL=$SERVICE_ACCOUNT_EMAIL
    args:
    - -c
    - ./hack/attest-images.sh
  # Fails the build when a digest it pushed or found published misses its
  # signature or one of its attestations, see hack/verify-attestations.sh.
  - name: golang:1.27.2-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
    entrypoint: bash
    env:
      - BUILD_ID=$BUILD_ID
      - PROJECT_ID=$PROJECT_ID
      - SERVICE_ACCOUNT_EMAIL=$SERVICE_ACCOUNT_EMAIL
      - SIGNER_IDENTITY=$SERVICE_ACCOUNT_EMAIL
      - SIGNER_OIDC_ISSUER=https://accounts.google.com
    args:
    - -c
    - ./hack/verify-attestations.sh
  # Attaches the provenance of the build workflow to the profiles, which may
  # wait for that workflow, so it runs after everything else got published and
  # attested, and only waits as long as the build timeout leaves time.
  - name: golang:1.27.2-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
    entrypoint: bash
    env:
      - BUILD_ID=$BUILD_ID
      # The timeout of the build above.
      - BUILD_TIMEOUT=2400
    args:
    - -c
    - ./hack/attach-profile-provenance.sh
substitutions:
  # _GIT_TAG will be filled with a git-based tag for the image, of the form
  # vYYYYMMDD-hash, and can be used as a substitution
  _GIT_TAG: '12345'
