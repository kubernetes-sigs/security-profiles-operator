version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  labels:
    - "release-note-none"
    - "ok-to-test"
  open-pull-requests-limit: 10
  ignore:
    # Newer releases moved to cel.dev/cel-go, which Dependabot cannot follow.
    # Switch together with the Kubernetes libraries.
    - dependency-name: "github.com/google/cel-go"
    # dependencies.yaml tracks the libbpf release it is built against, bump it
    # together with libbpf.
    - dependency-name: "github.com/aquasecurity/libbpfgo"
  groups:
    kubernetes:
      patterns:
        - "k8s.io/*"
        - "sigs.k8s.io/*"
# The module of the generators of committed files. Its requires are all
# indirect, which version updates do not cover, so the entry only shapes the
# security updates. The generators are bumped by hand, see the "Dependencies"
# section of doc/hacking.md.
- package-ecosystem: gomod
  directory: "/hack/tools"
  schedule:
    interval: daily
  labels:
    - "release-note-none"
    - "ok-to-test"
  ignore:
    - dependency-name: "github.com/maxbrunsfeld/counterfeiter/v6"
    - dependency-name: "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
    - dependency-name: "sigs.k8s.io/controller-tools"
- package-ecosystem: "github-actions"
  # The composite actions pin actions of their own, every directory below
  # .github/actions has to be listed.
  directories:
    - "/"
    - "/.github/actions/e2e-vm"
    - "/.github/actions/e2e-vm-artifacts"
    - "/.github/actions/scan-image"
    - "/.github/actions/setup-go-build"
    - "/.github/actions/setup-nix"
    - "/.github/actions/setup-vagrant"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  labels:
    - "release-note-none"
    - "ok-to-test"
  ignore:
    # dependencies.yaml keeps it on the release of the pre-commit hook, which
    # Dependabot does not update, so both get bumped together by hand.
    - dependency-name: "crate-ci/typos"
  groups:
    actions:
      patterns:
        - "*"
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels:
    - "release-note-none"
    - "ok-to-test"
  open-pull-requests-limit: 10
