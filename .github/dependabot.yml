version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  labels:
    - "release-note-none"
    - "ok-to-test"
  open-pull-requests-limit: 10
  ignore:
    # Newer releases moved to cel.dev/cel-go, which Dependabot cannot follow.
    # Switch together with the Kubernetes libraries.
    - dependency-name: "github.com/google/cel-go"
  groups:
    kubernetes:
      patterns:
        - "k8s.io/*"
        - "sigs.k8s.io/*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  labels:
    - "release-note-none"
    - "ok-to-test"
  groups:
    actions:
      patterns:
        - "*"
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels:
    - "release-note-none"
    - "ok-to-test"
  open-pull-requests-limit: 10
