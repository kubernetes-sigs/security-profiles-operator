version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  labels:
    - "release-note-none"
    - "ok-to-test"
  open-pull-requests-limit: 10
  ignore:
    # Newer releases moved to cel.dev/cel-go, which Dependabot cannot follow.
    # Switch together with the Kubernetes libraries.
    - dependency-name: "github.com/google/cel-go"
  groups:
    kubernetes:
      patterns:
        - "k8s.io/*"
        - "sigs.k8s.io/*"
- package-ecosystem: "github-actions"
  # The composite actions pin actions of their own, every directory below
  # .github/actions has to be listed.
  directories:
    - "/"
    - "/.github/actions/e2e-vm"
    - "/.github/actions/e2e-vm-artifacts"
    - "/.github/actions/scan-image"
    - "/.github/actions/setup-go-build"
    - "/.github/actions/setup-nix"
    - "/.github/actions/setup-vagrant"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  labels:
    - "release-note-none"
    - "ok-to-test"
  groups:
    actions:
      patterns:
        - "*"
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  labels:
    - "release-note-none"
    - "ok-to-test"
  open-pull-requests-limit: 10
