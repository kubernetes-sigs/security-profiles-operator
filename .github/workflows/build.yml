name: build
on:
  push:
    branches:
      - main
  release:
    types: [published]
  pull_request:
env:
  NIX_VERSION: '2.35.2'
# Runs on main and releases publish images, spoc binaries and the SBOM, so only
# pull request runs are cancelled by newer pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - run: make test-unit
      - run: make verify-go-lint

  nix:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          - ppc64le
    runs-on: ubuntu-24.04
    name: nix / ${{ matrix.arch }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: security-profiles-operator
          authToken: "${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}"
          pushFilter: security-profiles-operator
      - run: make nix-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.arch }}
          path: build/${{ matrix.arch }}

  nix-spoc:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          - ppc64le
          - s390x
    runs-on: ubuntu-24.04
    name: nix / spoc / ${{ matrix.arch }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: security-profiles-operator
          authToken: "${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}"
          pushFilter: security-profiles-operator
      - run: nix build .#spoc-${{ matrix.arch }}

  nix-spoc-push:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          - ppc64le
          - s390x
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    name: nix / spoc / push / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Builds only. Signing and provenance run in separate jobs, so the build
    # steps never hold an OIDC token or write access.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: security-profiles-operator
          # Pull-only: this job produces the binaries that ship, so it never
          # holds a credential that can write to the binary cache. The binaries
          # themselves are always built from source.
      - run: make nix-spoc-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spoc-${{ matrix.arch }}
          path: |
            build/*

  provenance-subjects:
    name: spoc / provenance subjects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every published architecture must have a provenance subject
        run: python3 hack/check-provenance-subjects.py

  spoc-sbom:
    needs: nix-spoc-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    name: spoc / sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bom
        run: |
          source hack/lib/common.sh
          sudo install -m 0755 "$(bom_bin)" /usr/bin/bom
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spoc-*
          path: build
          merge-multiple: true
      - run: make spoc-sbom
      # The provenance subjects: all spoc binaries and the SBOM.
      - id: hashes
        working-directory: build
        env:
          SUBJECTS: |
            spoc.amd64
            spoc.arm64
            spoc.ppc64le
            spoc.s390x
            spoc.spdx.json
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          hashes=$(sha256sum $SUBJECTS | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spoc-sbom
          path: build/spoc.spdx.json

  # Signs the binaries and the SBOM keylessly. It runs no repository code.
  spoc-sign:
    needs: spoc-sbom
    name: spoc / sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write  # required for sigstore signing
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spoc-*
          path: build
          merge-multiple: true
      - name: Sign
        working-directory: build
        run: |
          for file in spoc.*; do
            [[ "$file" == *.sha512 ]] && continue
            cosign sign-blob -y "$file" --bundle "$file.sigstore.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spoc-signatures
          path: build/*.sigstore.json

  # SLSA Build L3 provenance for the binaries and the SBOM, generated from their
  # digests by the isolated reusable workflow of the SLSA generator. Reusable
  # workflows can only be referenced by tag, the generator verifies its own ref.
  spoc-provenance:
    needs: spoc-sbom
    name: spoc / provenance
    permissions:
      actions: read  # required for reading the workflow run
      contents: write  # required for uploading the provenance to the release
      id-token: write  # required for signing the provenance
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.spoc-sbom.outputs.hashes }}
      provenance-name: spoc.intoto.jsonl
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

  # The only job besides the provenance generator that can write to the
  # release. It runs no repository code, it uploads the binaries, checksums,
  # signatures and the SBOM of the jobs above.
  spoc-release:
    needs: [spoc-sign, spoc-provenance]
    if: startsWith(github.ref, 'refs/tags/')
    name: spoc / release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # required for updating the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spoc-*
          path: build
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/*

  bpf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: security-profiles-operator
          authToken: "${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}"
          pushFilter: security-profiles-operator
      - run: make verify-bpf

  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      attestations: write  # required for the build provenance
      id-token: write  # required for sigstore signing
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Login to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io/security-profiles-operator
          username: security-profiles-operator+github
          password: ${{ secrets.QUAY_TOKEN }}
        if: github.ref == 'refs/heads/main'
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/security-profiles-operator/build
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
      - name: Build (and push if needed)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.build-image
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=build-image
          cache-to: type=gha,mode=min,scope=build-image
      # This image is the toolchain that compiles every released binary, so it
      # needs the same provenance as the binaries themselves. Without it, anyone
      # who can push to the repository can silently replace the compiler.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.ref == 'refs/heads/main'
      - name: Sign the build image
        if: github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes \
            quay.io/security-profiles-operator/build@${{ steps.build.outputs.digest }}
      - name: Attest the build image
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: quay.io/security-profiles-operator/build
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  operator-image:
    # Deliberately not `needs: build-image`: Dockerfile pins BUILD_IMAGE by
    # digest and this job passes no build-arg, so it builds against the pinned
    # digest either way. Depending on build-image would only serialize the two
    # and skip this job whenever that one fails, for no added coverage.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Login to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io/security-profiles-operator
          username: security-profiles-operator+github
          password: ${{ secrets.QUAY_TOKEN }}
        if: github.ref == 'refs/heads/main'
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/security-profiles-operator/spo
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator
      - name: Tag for the vulnerability scan
        run: docker tag ${{ steps.build.outputs.imageid }} security-profiles-operator:scan
      # Fails on every vulnerability with an available fix. Assessed findings
      # are suppressed through .openvex.json, see hacking.md.
      - name: Scan for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: .openvex.json
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          image-ref: security-profiles-operator:scan
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.74.0

  ubi-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Login to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io/security-profiles-operator
          username: security-profiles-operator+github
          password: ${{ secrets.QUAY_TOKEN }}
        if: github.ref == 'refs/heads/main'
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/security-profiles-operator/build
          flavor: |
            suffix=-ubi
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.ubi
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=ubi
          cache-to: type=gha,mode=max,scope=ubi
      - name: Tag for the vulnerability scan
        run: docker tag ${{ steps.build.outputs.imageid }} security-profiles-operator:scan
      # Fails on every vulnerability with an available fix. Assessed findings
      # are suppressed through .openvex.json, see hacking.md.
      - name: Scan for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: .openvex.json
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          image-ref: security-profiles-operator:scan
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.74.0
