name: build
on:
  push:
    branches:
      - main
  release:
    types: [published]
  pull_request:
env:
  NIX_VERSION: '2.35.2'
# Runs on main and releases publish images, spoc binaries and the SBOM, so only
# pull request runs are cancelled by newer pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Documentation only pull requests skip the builds, see hack/ci/code-changed.sh.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: hack/ci/code-changed.sh

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          # This workflow publishes, the Go cache is shared with every job
          # which runs repository code.
          cache: false
      - run: make test-unit
      - run: make verify-go-lint

  # Builds for development only, so they may write to the Cachix cache on main.
  # Nothing that is released uses that cache.
  nix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          - ppc64le
    runs-on: ubuntu-24.04
    name: nix / ${{ matrix.arch }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ env.NIX_VERSION }}
          cachix: ${{ github.event_name == 'push' && 'push' || 'pull' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: make nix-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.arch }}
          path: build/${{ matrix.arch }}

  # Pull requests only, nix-spoc-push builds the same on main and releases.
  nix-spoc:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          - ppc64le
          - s390x
    runs-on: ubuntu-24.04
    name: nix / spoc / ${{ matrix.arch }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ env.NIX_VERSION }}
      - run: nix build .#spoc-${{ matrix.arch }}

  nix-spoc-push:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          - ppc64le
          - s390x
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    name: nix / spoc / push / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    # Releases build the dependencies which are not on cache.nixos.org from
    # source.
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/') && 180 || 60 }}
    # Builds only. Signing and provenance run in separate jobs, so the build
    # steps never hold an OIDC token or write access. The binaries are always
    # built from source. For releases their dependencies come only from
    # cache.nixos.org or get built here, never from the Cachix cache, which
    # jobs running repository code write to. Development builds on main may
    # pull from it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ env.NIX_VERSION }}
          cachix: ${{ startsWith(github.ref, 'refs/tags/') && 'none' || 'pull' }}
      - run: make nix-spoc-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spoc-${{ matrix.arch }}
          path: |
            build/*

  provenance-subjects:
    name: spoc / provenance subjects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every published architecture must have a provenance subject
        run: python3 hack/check-provenance-subjects.py

  spoc-sbom:
    needs: nix-spoc-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    name: spoc / sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bom
        run: |
          source hack/lib/common.sh
          sudo install -m 0755 "$(bom_bin)" /usr/bin/bom
      - uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ env.NIX_VERSION }}
          cachix: none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spoc-*
          path: build
          merge-multiple: true
      - run: make spoc-sbom
      # The provenance subjects: all spoc binaries and the SBOMs.
      - id: hashes
        working-directory: build
        env:
          SUBJECTS: |
            spoc.amd64
            spoc.arm64
            spoc.ppc64le
            spoc.s390x
            spoc.spdx.json
            spoc-native.spdx.json
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          hashes=$(sha256sum $SUBJECTS | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spoc-sbom
          path: |
            build/spoc.spdx.json
            build/spoc-native.spdx.json

  # Signs the binaries and the SBOMs keylessly. It runs no repository code.
  spoc-sign:
    needs: spoc-sbom
    name: spoc / sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write  # required for sigstore signing
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spoc-*
          path: build
          merge-multiple: true
      - name: Sign
        working-directory: build
        run: |
          for file in spoc.* spoc-native.spdx.json; do
            [[ "$file" == *.sha512 ]] && continue
            cosign sign-blob -y "$file" --bundle "$file.sigstore.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spoc-signatures
          path: build/*.sigstore.json

  # SLSA Build L3 provenance for the binaries and the SBOMs, generated from
  # their digests by the isolated provenance workflow.
  spoc-provenance:
    needs: spoc-sbom
    name: spoc / provenance
    permissions:
      attestations: write  # required for storing the provenance
      id-token: write  # required for signing the provenance
    uses: ./.github/workflows/provenance.yml
    with:
      base64-subjects: ${{ needs.spoc-sbom.outputs.hashes }}
      provenance-name: spoc.intoto.jsonl

  # The only job that can write to the release. It runs no repository code, it
  # uploads the binaries, checksums, signatures, the SBOMs and the provenance
  # of the jobs above.
  spoc-release:
    needs: [spoc-sign, spoc-provenance]
    if: startsWith(github.ref, 'refs/tags/')
    name: spoc / release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # required for updating the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spoc*
          path: build
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/*

  # The image of a release is built on Cloud Build from the same sources and
  # the same nix toolchain, so its spoc must be bit for bit the released
  # binary. The promoted image is compared, whose tag cannot move, the release
  # gets published after the promotion. It runs no repository code and holds
  # no credentials.
  spoc-reproducible:
    needs: nix-spoc-push
    if: startsWith(github.ref, 'refs/tags/')
    name: spoc / reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spoc-amd64
          path: build
      - name: Compare with the spoc of the promoted image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          IMAGE=registry.k8s.io/security-profiles-operator/security-profiles-operator-amd64:$TAG
          docker pull "$IMAGE"
          CONTAINER=$(docker create "$IMAGE")
          docker cp "$CONTAINER:/spoc" build/spoc.image
          docker rm "$CONTAINER"
          sha256sum build/spoc.amd64 build/spoc.image
          cmp build/spoc.amd64 build/spoc.image

  bpf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          # This workflow publishes, the Go cache is shared with every job
          # which runs repository code.
          cache: false
      - uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ env.NIX_VERSION }}
          cachix: ${{ github.event_name == 'push' && 'push' || 'pull' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: make verify-bpf
      - run: make verify-go-version

  # The toolchain image that compiles every released binary. On main it is
  # built without any cache, pull requests only check that it builds and may
  # use the caches. The job pushes on main but holds no OIDC token, the
  # signature and the provenance come from build-image-sign.
  build-image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Login to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io/security-profiles-operator
          username: security-profiles-operator+github
          password: ${{ secrets.QUAY_TOKEN }}
        if: github.ref == 'refs/heads/main'
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/security-profiles-operator/build
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
      - name: Build (and push if needed)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.build-image
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: |
            CACHIX=${{ github.event_name == 'pull_request' && 'security-profiles-operator' || '' }}
          no-cache: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ github.event_name == 'pull_request' && 'type=gha,scope=build-image' || '' }}
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,mode=min,scope=build-image' || '' }}

  # This image is the toolchain that compiles every released binary, so it
  # needs the same provenance as the binaries themselves. Without it, anyone
  # who can push to the repository can silently replace the compiler. The job
  # runs no repository code.
  build-image-sign:
    needs: build-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write  # required for the build provenance
      id-token: write  # required for sigstore signing
    env:
      IMAGE: quay.io/security-profiles-operator/build
      DIGEST: ${{ needs.build-image.outputs.digest }}
    steps:
      - name: Login to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io/security-profiles-operator
          username: security-profiles-operator+github
          password: ${{ secrets.QUAY_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the build image
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest the build image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

  # Builds the images for the vulnerability scan, the published images are
  # built on Cloud Build.
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deliberately not `needs: build-image`: Dockerfile pins BUILD_IMAGE
          # by digest and this job passes no build-arg, so it builds against
          # the pinned digest either way.
          - name: operator-image
            file: Dockerfile
            image: quay.io/security-profiles-operator/spo
            suffix: ''
            cache: operator
          - name: ubi-image
            file: Dockerfile.ubi
            image: quay.io/security-profiles-operator/build
            suffix: -ubi
            cache: ubi
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          flavor: |
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
      - name: Tag for the vulnerability scan
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: docker tag "$IMAGE_ID" security-profiles-operator:scan
      # Fails on every vulnerability with an available fix. Assessed findings
      # are suppressed through .openvex.json, see doc/hacking.md.
      - name: Scan for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: .openvex.json
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          image-ref: security-profiles-operator:scan
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.74.0
