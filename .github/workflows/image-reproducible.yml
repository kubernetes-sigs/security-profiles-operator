name: image-reproducible
# The per-arch images, the bundle and the catalog are built and pushed to
# staging on Cloud Build. This workflow builds them from the same commit with
# the same script and the same pinned BuildKit, without pushing anything and
# without credentials. On main it compares their digests with the staging
# images Cloud Build pushes for the commit, which shows that the staging
# images are reproducible from the source. Releases are built from a commit on
# main, which was compared then. For a release, the images of the tagged
# commit are built once more and their digests get SLSA Build L3 provenance,
# which the release artifacts job attaches to the staging images with the
# same digests, see doc/release.md#per-arch-images and
# doc/release.md#bundle-and-catalog.
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]
# The comparison waits up to 45 minutes for Cloud Build, which is why it is not
# part of the build workflow: there it would keep runs of main going, and a
# newer push would cancel the pending run of main with its publishing jobs.
# Every commit of main and every release gets its own group here, so that none
# is cancelled or skipped, only pull request runs are cancelled by newer
# pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Documentation only pull requests skip the build, see hack/ci/code-changed.sh.
  changes:
    uses: ./.github/workflows/changes.yml

  image-reproducible:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: image / reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Builds only, also for a release: the provenance runs in a separate job,
    # so the build steps never hold an OIDC token or write access.
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # For crane, which serves the throwaway registry the catalog is rendered
      # from, see build_catalog in hack/image-cross.sh.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          # This workflow builds the release subjects, the Go cache is shared
          # with every job which runs repository code.
          cache: false
      - name: Build the per-arch images, the bundle and the catalog
        env:
          PUSH: "false"
        run: hack/image-cross.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests
          path: |
            build/image-digests
            build/metadata-image-digests
          if-no-files-found: error
      # The provenance subjects of a release: the manifest digest of each
      # per-arch image, of the bundle and of the catalog, named after its
      # repository, for example security-profiles-operator-amd64 or
      # security-profiles-operator-bundle.
      - id: hashes
        if: github.event_name == 'release'
        run: |
          while IFS=@ read -r repo digest; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unexpected digest $digest of $repo"
              exit 1
            fi
            echo "${digest#sha256:}  ${repo##*/}"
          done < <(cat build/image-digests build/metadata-image-digests) > build/image-subjects.sha256
          cat build/image-subjects.sha256
          echo "hashes=$(base64 -w0 build/image-subjects.sha256)" >> "$GITHUB_OUTPUT"
      - name: Compare with the staging images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: hack/ci/compare-staging-images.sh

  # SLSA Build L3 provenance for the per-arch images of a release, generated
  # from their digests by the isolated provenance workflow.
  image-provenance:
    needs: image-reproducible
    if: github.event_name == 'release'
    name: image / provenance
    permissions:
      attestations: write  # required for storing the provenance
      id-token: write  # required for signing the provenance
    uses: ./.github/workflows/provenance.yml
    with:
      base64-subjects: ${{ needs.image-reproducible.outputs.hashes }}
      provenance-name: images.intoto.jsonl

  # Attaches the provenance to the release. It runs no repository code. The
  # asset of a first run is never replaced: the release artifacts job may have
  # attached it to the staging images already, and a re-run attests the same
  # digests again.
  image-release:
    needs: image-provenance
    if: github.event_name == 'release'
    name: image / release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # required for updating the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images.intoto.jsonl
          path: build
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          overwrite_files: false
          files: |
            build/images.intoto.jsonl
