name: olm
on:
  push:
    branches:
      - main
  pull_request:
env:
  # Pinned by digest, see kind-image and kind-image-digest in dependencies.yaml.
  KIND_IMG_TAG: v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
# Only pull request runs are cancelled by newer pushes, runs on main or for a
# release always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Documentation only pull requests skip the tests, see hack/ci/code-changed.sh.
  changes:
    uses: ./.github/workflows/changes.yml

  main:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: tests
    runs-on: ubuntu-24.04
    # The tests install the operator seven times (all, own, single and multi
    # namespace, a custom namespace and two feature variables), each waiting up
    # to three minutes per condition, after building the images.
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download binaries
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/build"
        echo "${GITHUB_WORKSPACE}/build" >> "${GITHUB_PATH}"
        make operator-sdk opm

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ./go.mod

    - name: Install dependencies
      run: |
        sudo ./hack/install-packages
        ./hack/install-crun

    - name: Create and verify bundle
      run: |
        make verify-bundle

    - name: Create and set up K8s KinD Cluster
      run: |
        ./hack/kind-with-registry.sh

    - name: Run the tests
      run: ./hack/ci/e2e-olm.sh
      env:
        XDG_RUNTIME_DIR: ''
