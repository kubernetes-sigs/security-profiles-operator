name: fuzz
# Runs every fuzz target of make test-fuzz for a few minutes once a week. The
# pull request checks only run the seed corpus as part of the unit tests. A
# failing input gets written below testdata/fuzz of the package, which the
# job uploads, commit it there to turn it into a regression test.
on:
  schedule:
    - cron: '47 3 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    # make test-fuzz runs the targets one after another, FUZZ_TIME each plus
    # the build of the package. Lower FUZZ_TIME when the targets outgrow it.
    timeout-minutes: 90
    permissions:
      contents: read  # required for the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-build
      # A failing target does not stop the others, the step fails at the end.
      - run: make test-fuzz FUZZ_TIME=3m
      # The fuzz targets live below the same directories as FUZZ_TARGETS of
      # the Makefile.
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: |
            internal/**/testdata/fuzz/
            cmd/**/testdata/fuzz/
            api/**/testdata/fuzz/
          if-no-files-found: ignore

  # Opens an issue, or comments on the open one, when a scheduled run fails,
  # like the e2e-flakes workflow, so that a crash the fuzzer found does not
  # go unnoticed. It runs no repository code.
  report:
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write  # required for reporting the failure
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report the failure
        run: |
          title="Weekly fuzz run failed"
          body="The scheduled run $RUN_URL failed, see the fuzz-failures artifact of its fuzz job for the failing inputs, commit them below testdata/fuzz of the package to turn them into regression tests."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
