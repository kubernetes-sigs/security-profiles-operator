name: helm-chart-package
on:
  pull_request:
  release:
    types: [published]
# Only pull request runs are cancelled by newer pushes, runs on main or for a
# release always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  helm-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tgz-name: ${{ steps.package.outputs.helm_tgz_name }}
      hashes: ${{ steps.package.outputs.hashes }}
      provenance-name: ${{ steps.package.outputs.provenance_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - run: mkdir -p build
      - id: package
        run: |
          set -o pipefail
          helm_output="$(helm package -d build deploy/helm)"
          tgz_path="${helm_output##*saved it to: }"
          echo "helm chart tgz path: '${tgz_path}'"
          [ ! -f "${tgz_path}" ] && echo "failed to find helm chart from 'helm package' stdout" && exit 1
          tgz_name="${tgz_path##*/}"
          hashes=$(cd build && sha256sum "${tgz_name}" | base64 -w0)
          {
            echo "helm_tgz_path=${tgz_path}"
            echo "helm_tgz_name=${tgz_name}"
            echo "provenance_name=${tgz_name%.tgz}.intoto.jsonl"
            echo "hashes=${hashes}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.helm_tgz_name}}
          path: ${{ steps.package.outputs.helm_tgz_path}}
          if-no-files-found: error

  # SLSA Build L3 provenance for the released chart, generated from its digest
  # by the isolated provenance workflow.
  helm-provenance:
    needs: helm-package
    if: github.event_name == 'release'
    permissions:
      attestations: write  # required for storing the provenance
      id-token: write  # required for signing the provenance
    uses: ./.github/workflows/provenance.yml
    with:
      base64-subjects: ${{ needs.helm-package.outputs.hashes }}
      provenance-name: ${{ needs.helm-package.outputs.provenance-name }}

  # Signs the released chart and attaches it with its provenance to the
  # release. It runs no repository code, pull requests only package the chart.
  helm-release:
    needs: [helm-package, helm-provenance]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # required for updating the release
      id-token: write  # required for sigstore signing
    timeout-minutes: 15
    env:
      TGZ_PATH: build/${{ needs.helm-package.outputs.tgz-name }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.helm-package.outputs.tgz-name }}
          path: build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.helm-package.outputs.provenance-name }}
          path: build
      - name: Sign
        run: cosign sign-blob -y "$TGZ_PATH" --bundle "$TGZ_PATH.sigstore.json"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/*
