name: helm-chart-package
on:
  pull_request:
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  helm-package:
    runs-on: ubuntu-24.04
    permissions:
      attestations: write  # required for the build provenance
      contents: write
      id-token: write  # required for sigstore signing
    timeout-minutes: 15
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'release'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3
      - run: mkdir -p build
      - id: package
        run: |
          helm_output="$(helm package -d build deploy/helm)"
          tgz_path="${helm_output##*saved it to: }"
          echo "helm chart tgz path: '${tgz_path}'"
          [ ! -f "${tgz_path}" ] && echo "failed to find helm chart from 'helm package' stdout" && exit 1
          echo "helm_tgz_path=${tgz_path}" >> $GITHUB_OUTPUT
          echo "helm_tgz_name=${tgz_path##*/}" >> $GITHUB_OUTPUT
      # The released chart is signed and gets SLSA build provenance, pull
      # requests only package it.
      - name: Sign
        if: github.event_name == 'release'
        env:
          TGZ_PATH: ${{ steps.package.outputs.helm_tgz_path }}
        run: cosign sign-blob -y "$TGZ_PATH" --bundle "$TGZ_PATH.sigstore.json"
      - id: provenance
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.helm_tgz_path }}
      - if: github.event_name == 'release'
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          TGZ_PATH: ${{ steps.package.outputs.helm_tgz_path }}
        run: cp "$BUNDLE_PATH" "${TGZ_PATH%.tgz}.intoto.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.helm_tgz_name}}
          path: ${{ steps.package.outputs.helm_tgz_path}}
          if-no-files-found: error
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/*
