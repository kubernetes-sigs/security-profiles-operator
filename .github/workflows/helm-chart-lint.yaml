name: helm-chart-lint

on:
  push:
    branches:
      - main
  pull_request:
# Only pull request runs are cancelled by newer pushes, runs on main or for a
# release always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: >
          ct lint
          --chart-dirs deploy/helm
          --target-branch "$TARGET_BRANCH"
          --lint-conf hack/ci/chart-test-lintconf.yaml
          --chart-yaml-schema hack/ci/chart_schema.yaml
