name: helm-chart-lint

on:
  push:
    branches:
      - main
  pull_request:
# Only pull request runs are cancelled by newer pushes. Every push to main gets
# a group of its own: GitHub cancels the pending run of a group when a newer
# one queues, even without cancel-in-progress, which would leave that commit
# untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # The chart supports both Helm major versions, `helm lint` also validates
  # the values against values.schema.json.
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - helm: v3.22.0
          - helm: v4.3.0
    name: lint-test / helm ${{ matrix.helm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      # deploy/helm is the chart itself, not a directory of charts, so it gets
      # linted explicitly: --chart-dirs would find no changed chart below it.
      # The chart version only changes on releases and the chart lists no
      # maintainers, so neither gets checked.
      - name: Run chart-testing (lint)
        run: >
          ct lint
          --charts deploy/helm
          --check-version-increment=false
          --validate-maintainers=false
          --lint-conf hack/ci/chart-test-lintconf.yaml
          --chart-yaml-schema hack/ci/chart_schema.yaml
