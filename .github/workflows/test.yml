name: test
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
      - 'OWNERS'
      - 'SECURITY_CONTACTS'
  # Deliberately no paths-ignore here. A skipped workflow reports no check runs
  # at all, so if any job in it is a required context, a documentation-only pull
  # request waits forever for a check that will never report.
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    permissions:

      # write security-events is required by all codeql-action workflows
      security-events: write

    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go
      - uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - name: Install dependencies
        run: sudo hack/install-packages
      - run: make test-unit
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage.out
          flags: unittests
          verbose: true

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: hack/install-crun
      - run: make image
        env:
          XDG_RUNTIME_DIR: ''
      - run: podman save -o image.tar security-profiles-operator
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: image.tar

  # Cross built, because the final image stage only copies the binaries.
  image-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: hack/install-crun
      - run: make image-arm64
        env:
          XDG_RUNTIME_DIR: ''
      - run: podman save -o image.tar security-profiles-operator
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-arm64
          path: image.tar

  e2e-fedora:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUN: ./hack/ci/run-fedora.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vagrant
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - name: Boot Virtual Machine
        run: make vagrant-up-fedora
      - name: Show environment information
        run: |
          $RUN kubectl wait --for=condition=ready --timeout=60s nodes --all
          $RUN kubectl get nodes -o wide
      - name: Set up git config
        run: |
          $RUN git config --global --add safe.directory /vagrant
      - name: Run E2E tests
        run: $RUN hack/ci/e2e-fedora.sh
      # Flaky tests get one retry, failing twice in a row fails the job.
      - name: Run Flaky E2E tests
        run: |
          $RUN "echo \"export E2E_TEST_FLAKY_TESTS_ONLY=true\" >> /vagrant/hack/ci/env.sh"
          $RUN hack/ci/e2e-fedora.sh || $RUN hack/ci/e2e-fedora.sh

  e2e-ubuntu:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUN: ./hack/ci/run-ubuntu.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vagrant
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - name: Boot Virtual Machine
        run: make vagrant-up-ubuntu
      - name: Show environment information
        run: |
          $RUN kubectl wait --for=condition=ready --timeout=60s nodes --all
          $RUN kubectl get nodes -o wide
      - name: Set up git config
        run: |
          $RUN git config --global --add safe.directory /vagrant
      - name: Run E2E tests
        run: $RUN hack/ci/e2e-ubuntu.sh
      # Flaky tests get one retry, failing twice in a row fails the job.
      - name: Run Flaky E2E tests
        run: |
          $RUN "echo \"export E2E_TEST_FLAKY_TESTS_ONLY=true\" >> /vagrant/hack/ci/env.sh"
          $RUN hack/ci/e2e-ubuntu.sh || $RUN hack/ci/e2e-ubuntu.sh

  e2e-flatcar:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUN: ./hack/ci/run-flatcar.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vagrant
      - name: Upgrade vagrant box
        run: |
          ln -sf hack/ci/Vagrantfile-flatcar Vagrantfile
          vagrant box update
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - name: Boot Virtual Machine
        run: make vagrant-up-flatcar
      - name: Show environment information
        run: |
          $RUN kubectl wait --for=condition=ready --timeout=600s node localhost
          $RUN kubectl get nodes -o wide
      - name: Run E2E tests
        run: $RUN hack/ci/e2e-flatcar-dev-container.sh
      # Flaky tests get one retry, failing twice in a row fails the job.
      - name: Run Flaky E2E tests
        run: |
          $RUN "echo \"export E2E_TEST_FLAKY_TESTS_ONLY=true\" >> /vagrant/hack/ci/env-flatcar.sh"
          $RUN hack/ci/e2e-flatcar-dev-container.sh || $RUN hack/ci/e2e-flatcar-dev-container.sh

  e2e-spoc:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUN: ./hack/ci/run-debian.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vagrant
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - name: Boot Virtual Machine
        run: make vagrant-up-debian
      - name: Show environment information
        run: |
          $RUN kubectl wait --for=condition=ready --timeout=60s nodes --all
          $RUN kubectl get nodes -o wide
      - name: Set up git config
        run: |
          $RUN git config --global --add safe.directory /vagrant
      - name: Run spoc E2E tests
        run: $RUN hack/ci/e2e-spoc.sh

  # Records the base profiles of the OCI runtimes on a kubernix cluster per
  # architecture. The recordings get merged into the profiles in examples by
  # e2e-seccomp-profile-update.
  e2e-seccomp-profile:
    needs: [image, image-arm64]
    name: e2e-seccomp-profile / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            image: image
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: image-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.image }}
          path: .
      - name: Record seccomp profiles
        run: hack/ci/e2e-seccomp.sh build/recordings/${{ matrix.arch }}
      - name: Show kubernix logs
        if: failure()
        run: |
          . hack/ci/install-kubernix.sh
          print_kubernix_logs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seccomp-recording-${{ matrix.arch }}
          path: build/recordings
          if-no-files-found: error

  e2e-seccomp-profile-update:
    needs: e2e-seccomp-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: seccomp-recording-*
          path: build/recordings
          merge-multiple: true
      - name: Merge the recordings into the base profiles
        run: hack/ci/update-base-profiles.sh build/recordings
      # A profile that changed can be committed as it is. The merge marks when
      # it regenerated all profiles, an earlier failure leaves them unchanged.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && hashFiles('build/merged') != ''
        with:
          name: recorded-base-profiles
          path: examples/baseprofile-*.yaml

  e2e-apparmor-profile:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUN: ./hack/ci/run-debian.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vagrant
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - name: Boot Virtual Machine
        run: make vagrant-up-debian
      - name: Show environment information
        run: |
          $RUN kubectl wait --for=condition=ready --timeout=60s nodes --all
          $RUN kubectl get nodes -o wide
      - name: Set up git config
        run: |
          $RUN git config --global --add safe.directory /vagrant
      - name: Run E2E test to record apparmor profile
        run: $RUN hack/ci/e2e-apparmor.sh

  helm-install:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIND_IMG_TAG: v1.37.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3
      - name: Create and set up K8s KinD Cluster
        run: ./hack/kind-with-registry.sh
      - name: Install the Helm chart
        run: ./hack/ci/install-helm-chart.sh

  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
        with:
          config: .typos.toml
