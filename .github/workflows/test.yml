name: test
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
      - 'OWNERS'
      - 'SECURITY_CONTACTS'
  # Deliberately no paths-ignore here. A skipped workflow reports no check runs
  # at all, so if any job in it is a required context, a documentation-only pull
  # request waits forever for a check that will never report. The changes job
  # skips the jobs instead.
  pull_request:
# Runs on main merge the seccomp base profile recordings, so only pull request
# runs are cancelled by newer pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Documentation only pull requests skip the tests, see hack/ci/code-changed.sh.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: hack/ci/code-changed.sh

  analyze:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:

      # write security-events is required by all codeql-action workflows
      security-events: write

    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: coverage / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - name: Install dependencies
        run: sudo hack/install-packages
      - run: make test-unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.arch }}
          path: build/coverage.out
          if-no-files-found: error

  # Uploads the coverage with a short lived OIDC token instead of a stored
  # secret. It runs no repository code. Pull requests from forks get no OIDC
  # token, their upload may fail without failing the job.
  coverage-upload:
    needs: coverage
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    name: coverage-upload / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write  # required for the codecov OIDC upload
    env:
      FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Codecov maps the report paths to the files of the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-${{ matrix.arch }}
          path: build
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage.out
          flags: unittests,${{ matrix.arch }}
          use_oidc: ${{ env.FORK != 'true' }}
          fail_ci_if_error: ${{ env.FORK != 'true' }}
          verbose: true

  # arm64 is cross built, because the final image stage only copies the
  # binaries.
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: image
            target: image
          - name: image-arm64
            target: image-arm64
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: hack/install-crun
      - run: make ${{ matrix.target }}
        env:
          XDG_RUNTIME_DIR: ''
      - run: podman save -o image.tar security-profiles-operator
      # The scanned image is the one the e2e jobs test. Fails on every
      # vulnerability with an available fix. Assessed findings are suppressed
      # through .openvex.json, see doc/hacking.md.
      - name: Scan for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: .openvex.json
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          input: image.tar
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.74.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: image.tar

  # Built outside of the Fedora VM, where it takes about 10 minutes, see
  # hack/ci/build-selinuxd-fedora.sh.
  selinuxd-fedora:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: hack/ci/build-selinuxd-fedora.sh
      - run: podman save -o selinuxd-fedora.tar localhost/selinuxd-fedora:latest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selinuxd-fedora
          path: selinuxd-fedora.tar

  # Compiling the e2e tests takes more than 10 minutes in the Fedora VM, see
  # E2E_TEST_BINARY in the Makefile.
  e2e-test-binary:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - run: go test -c -tags e2e -o e2e.test ./test
        env:
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-binary
          path: e2e.test

  # The SELinux tests run in a VM of their own, see hack/ci/e2e-fedora.sh.
  e2e-fedora:
    needs: [image, selinuxd-fedora, e2e-test-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e-fedora
            suite: enricher
          - name: e2e-fedora-selinux
            suite: selinux
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Booting the VM takes up to 10 minutes and the E2E tests up to 30, which
    # leaves the flaky test step with its retry too little time within 90.
    timeout-minutes: 120
    env:
      RUN: ./hack/ci/run-fedora.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vagrant
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.suite == 'selinux'
        with:
          name: selinuxd-fedora
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-test-binary
          path: build
      - name: Boot Virtual Machine
        run: make vagrant-up-fedora
      - name: Show environment information
        run: |
          $RUN kubectl wait --for=condition=ready --timeout=60s nodes --all
          $RUN kubectl get nodes -o wide
      - name: Set up the test environment
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          $RUN git config --global --add safe.directory /vagrant
          $RUN "echo \"export E2E_FEDORA_SUITE=$SUITE\" >> /vagrant/hack/ci/env.sh"
          $RUN "echo \"export E2E_ARTIFACTS_DIR=/vagrant/build/e2e-artifacts\" >> /vagrant/hack/ci/env.sh"
      - name: Run E2E tests
        run: $RUN hack/ci/e2e-fedora.sh
      # Failed flaky tests get one retry, see make test-flaky-e2e. Each attempt
      # may take E2E_RETRY_TIMEOUT (30m), plus the deployment of the operator.
      - name: Run Flaky E2E tests
        timeout-minutes: 70
        run: |
          $RUN "echo \"export E2E_TEST_FLAKY_TESTS_ONLY=true\" >> /vagrant/hack/ci/env.sh"
          $RUN hack/ci/e2e-fedora.sh
      # The VM only gets the repository synced in, so the report of the flaky
      # test retries has to be copied out.
      - name: Copy the flaky test report out of the VM
        if: always()
        continue-on-error: true
        run: hack/ci/copy-from-vm.sh /vagrant/build/junit-flaky-e2e.xml build
      - name: Upload the flaky test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-flaky-${{ matrix.name }}
          path: build/junit-flaky-e2e.xml
          if-no-files-found: ignore
      - name: Copy the diagnostics out of the VM
        if: failure()
        continue-on-error: true
        run: hack/ci/copy-from-vm.sh /vagrant/build/e2e-artifacts build
      - name: Upload the diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.name }}
          path: build/e2e-artifacts
          if-no-files-found: ignore

  # Runs the e2e suite on a kubernix cluster on the runner, which is the node.
  e2e-ubuntu:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          # No arm64 yet: the quay.io/security-profiles-operator/test-*
          # images the suite runs are amd64 only, so their pods fail to start
          # on arm64. The e2e-seccomp-profile job covers arm64.
          - arch: amd64
            runner: ubuntu-24.04
            image: image
    name: e2e-ubuntu / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # The suite runs in ./test, so the directory must be absolute.
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/build/e2e-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.image }}
          path: .
      - name: Start kubernix
        run: hack/ci/start-kubernix.sh image.tar
      - name: Run E2E tests
        run: hack/ci/e2e-ubuntu.sh
      # Failed flaky tests get one retry, see make test-flaky-e2e. Each attempt
      # may take E2E_RETRY_TIMEOUT (30m), plus the deployment of the operator.
      - name: Run Flaky E2E tests
        timeout-minutes: 70
        env:
          E2E_TEST_FLAKY_TESTS_ONLY: 'true'
        run: hack/ci/e2e-ubuntu.sh
      - name: Upload the flaky test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-flaky-e2e-ubuntu-${{ matrix.arch }}
          path: build/junit-flaky-e2e.xml
          if-no-files-found: ignore
      - name: Upload the diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-e2e-ubuntu-${{ matrix.arch }}
          path: build/e2e-artifacts
          if-no-files-found: ignore
      - name: Show kubernix logs
        if: failure()
        run: |
          . hack/ci/install-kubernix.sh
          print_kubernix_logs

  e2e-flatcar:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUN: ./hack/ci/run-flatcar.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vagrant
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - name: Boot Virtual Machine
        run: make vagrant-up-flatcar
      - name: Show environment information
        run: |
          $RUN kubectl wait --for=condition=ready --timeout=600s node localhost
          $RUN kubectl get nodes -o wide
      # The tests run in a container with the root of the VM at /hostfs.
      - name: Set up the test environment
        run: |
          $RUN "echo \"export E2E_ARTIFACTS_DIR=/hostfs/vagrant/build/e2e-artifacts\" >> /vagrant/hack/ci/env-flatcar.sh"
      - name: Run E2E tests
        run: $RUN hack/ci/e2e-flatcar-dev-container.sh
      # Failed flaky tests get one retry, see make test-flaky-e2e. Each attempt
      # may take E2E_RETRY_TIMEOUT (30m), plus the deployment of the operator.
      - name: Run Flaky E2E tests
        timeout-minutes: 70
        run: |
          $RUN "echo \"export E2E_TEST_FLAKY_TESTS_ONLY=true\" >> /vagrant/hack/ci/env-flatcar.sh"
          $RUN hack/ci/e2e-flatcar-dev-container.sh
      # The VM only gets the repository synced in, so the report of the flaky
      # test retries has to be copied out.
      - name: Copy the flaky test report out of the VM
        if: always()
        continue-on-error: true
        run: hack/ci/copy-from-vm.sh /vagrant/build/junit-flaky-e2e.xml build
      - name: Upload the flaky test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-flaky-e2e-flatcar
          path: build/junit-flaky-e2e.xml
          if-no-files-found: ignore
      - name: Copy the diagnostics out of the VM
        if: failure()
        continue-on-error: true
        run: hack/ci/copy-from-vm.sh /vagrant/build/e2e-artifacts build
      - name: Upload the diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-e2e-flatcar
          path: build/e2e-artifacts
          if-no-files-found: ignore

  # The spoc tests and the AppArmor recording share one Debian VM, booting it
  # takes about 7 minutes.
  e2e-debian:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUN: ./hack/ci/run-debian.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vagrant
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - name: Boot Virtual Machine
        run: make vagrant-up-debian
      - name: Show environment information
        run: |
          $RUN kubectl wait --for=condition=ready --timeout=60s nodes --all
          $RUN kubectl get nodes -o wide
      - name: Set up the test environment
        run: |
          $RUN git config --global --add safe.directory /vagrant
          $RUN "echo \"export E2E_ARTIFACTS_DIR=/vagrant/build/e2e-artifacts\" >> /vagrant/hack/ci/env.sh"
      - name: Run spoc E2E tests
        run: $RUN hack/ci/e2e-spoc.sh
      - name: Run E2E test to record apparmor profile
        if: success() || failure()
        run: $RUN hack/ci/e2e-apparmor.sh
      - name: Copy the diagnostics out of the VM
        if: failure()
        continue-on-error: true
        run: hack/ci/copy-from-vm.sh /vagrant/build/e2e-artifacts build
      - name: Upload the diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-e2e-debian
          path: build/e2e-artifacts
          if-no-files-found: ignore

  # spoc runs on the host and needs no cluster. The runner kernel has no BPF
  # LSM, so the AppArmor recording tests skip here and run on the VM above.
  e2e-spoc-arm64:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/build/e2e-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - name: Install dependencies
        run: sudo hack/install-packages
      - name: Run spoc E2E tests
        run: hack/ci/e2e-spoc.sh
      - name: Upload the diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-e2e-spoc-arm64
          path: build/e2e-artifacts
          if-no-files-found: ignore

  # Records the base profiles of the OCI runtimes on a kubernix cluster per
  # architecture. The recordings get merged into the profiles in examples by
  # e2e-seccomp-profile-update.
  e2e-seccomp-profile:
    needs: image
    name: e2e-seccomp-profile / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/build/e2e-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            image: image
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: image-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.image }}
          path: .
      - name: Record seccomp profiles
        run: hack/ci/e2e-seccomp.sh build/recordings/${{ matrix.arch }}
      - name: Show kubernix logs
        if: failure()
        run: |
          . hack/ci/install-kubernix.sh
          print_kubernix_logs
      - name: Upload the diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-e2e-seccomp-profile-${{ matrix.arch }}
          path: build/e2e-artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seccomp-recording-${{ matrix.arch }}
          path: build/recordings
          if-no-files-found: error

  e2e-seccomp-profile-update:
    needs: e2e-seccomp-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: seccomp-recording-*
          path: build/recordings
          merge-multiple: true
      - name: Merge the recordings into the base profiles
        run: hack/ci/update-base-profiles.sh build/recordings
      # A profile that changed can be committed as it is. The merge marks when
      # it regenerated all profiles, an earlier failure leaves them unchanged.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && hashFiles('build/merged') != ''
        with:
          name: recorded-base-profiles
          path: examples/baseprofile-*.yaml

  # Installs the last released chart and upgrades it to the one of this tree,
  # on the oldest supported and the current Kubernetes release, with both
  # Helm major versions. The node images are pinned by digest, see kind-image
  # and kind-image-min in dependencies.yaml.
  helm-install:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: v1.30.13@sha256:397209b3d947d154f6641f2d0ce8d473732bd91c87d9575ade99049aa33cd648
            helm: v3.22.0
          - kind: v1.30.13@sha256:397209b3d947d154f6641f2d0ce8d473732bd91c87d9575ade99049aa33cd648
            helm: v4.3.0
          - kind: v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            helm: v3.22.0
          - kind: v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            helm: v4.3.0
    name: helm-install / kind ${{ matrix.kind }} / helm ${{ matrix.helm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KIND_IMG_TAG: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: .
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - name: Create and set up K8s KinD Cluster
        run: ./hack/kind-with-registry.sh
      - name: Install the Helm chart
        run: ./hack/ci/install-helm-chart.sh

  # The Go e2e suite on kind, which creates a fresh cluster per test and
  # builds the image itself. Like the Prow job
  # hack/pull-security-profiles-operator-test-e2e, it runs the seccomp tests,
  # which need the kubelet directory at /var/lib/kubelet.
  # It runs on amd64 only: the build image and the
  # quay.io/security-profiles-operator/test-* images the suite uses are not
  # published for arm64.
  e2e-kind:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # kind loads the image from docker, the runners have podman too.
      CONTAINER_RUNTIME: docker
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/build/e2e-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - name: Run E2E tests
        run: make test-e2e
      - name: Upload the diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-e2e-kind
          path: build/e2e-artifacts
          if-no-files-found: ignore

  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
        with:
          config: .typos.toml
