name: Set up vagrant
description: Install vagrant and VirtualBox and unload the KVM modules that conflict with VirtualBox
runs:
  using: composite
  steps:
    - name: Install vagrant and VirtualBox
      shell: bash
      env:
        # The fingerprint of the HashiCorp Linux package signing key, see
        # https://www.hashicorp.com/en/trust/security. apt trusts the key for
        # the repository, so it is checked before it gets installed. A key
        # rotation fails this step until the fingerprint gets updated.
        HASHICORP_FINGERPRINT: D55C0D1AC78A8D8126CB631CFC9CA96ACA026560
      run: |
        key="$RUNNER_TEMP/hashicorp.asc"
        curl -fsSL --retry 5 --retry-delay 3 -o "$key" https://apt.releases.hashicorp.com/gpg
        # The fingerprints of the primary keys, there must be exactly the one.
        fingerprints=$(gpg --show-keys --with-colons "$key" |
          awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')
        if [[ "$fingerprints" != "$HASHICORP_FINGERPRINT" ]]; then
          echo "Unexpected HashiCorp key fingerprints: $fingerprints" >&2
          exit 1
        fi
        sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg "$key"
        rm -f "$key"
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update
        sudo apt-get install -y vagrant virtualbox
    - name: Unload KVM modules
      shell: bash
      run: |
        sudo modprobe -r kvm_amd kvm_intel kvm || true
