name: Set up nix
description: >-
  Install nix and optionally the project's Cachix binary cache. Jobs that
  produce released artifacts do not use Cachix, only cache.nixos.org, because
  jobs which run repository code write to it.
inputs:
  nix-version:
    description: The nix version to install
    required: true
  cachix:
    description: >-
      Whether to use the Cachix cache: "none", "pull" or "push". Pushing needs
      cachix-auth-token.
    default: pull
  cachix-auth-token:
    description: The Cachix token, pushing is disabled without it
    default: ''
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        install_url: https://releases.nixos.org/nix/nix-${{ inputs.nix-version }}/install
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      if: inputs.cachix != 'none'
      with:
        name: security-profiles-operator
        authToken: ${{ inputs.cachix == 'push' && inputs.cachix-auth-token || '' }}
        pushFilter: security-profiles-operator
