name: Set up an e2e VM
description: >-
  Boot the Vagrant VM of an e2e job and prepare its test environment, then
  load the operator image of the image job into it, unless the job does that
  later with the e2e-vm-image action. The VM boots while the image job may
  still build the image, so the job needs no needs: on it, but the
  actions: read permission. The job runs the tests with hack/ci/run-<vm>.sh
  afterwards and collects the results with the e2e-vm-artifacts action. Other
  artifacts the VM needs have to be downloaded before, the VM gets the
  repository synced in when it boots.
inputs:
  vm:
    description: The VM to boot, "fedora", "debian" or "flatcar"
    required: true
  image:
    description: Whether to load the operator image right after the boot
    default: 'true'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-vagrant
    - name: Boot Virtual Machine
      shell: bash
      env:
        VM: ${{ inputs.vm }}
        VAGRANT_BUILD_IMAGE: 'false'
      run: make "vagrant-up-$VM"
    - name: Set up the test environment
      shell: bash
      env:
        VM: ${{ inputs.vm }}
      run: hack/ci/setup-vm-env.sh "$VM"
    - uses: ./.github/actions/e2e-vm-image
      if: inputs.image == 'true'
      with:
        vm: ${{ inputs.vm }}
